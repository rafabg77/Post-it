<span class="ind1">Escala Básica — Ejecución</span>`},{id:"extra-1788170027307",nota:67,cat:"A",tags:["L"],titulo:"Fiscal General del Estado",body:"Se elegirá de entre juristas españoles de reconocido prestigio con más de quince años de ejercicio efectivo de su profesión."},{id:"extra-1788170207111",nota:68,cat:"A",tags:["L"],titulo:"¿Cuánto tiempo deberá transcurrir desde la presentación de una moción de censura hasta su votación?",body:"Cinco días."},{id:"extra-1788171133641",nota:69,cat:"A",titulo:"EL SECTOR PÚBLICO INSTITUCIONAL",body:"a) Los organismos públicos vinculados o dependientes de la Administración General del Estado, los cuales se clasifican en:<br><br>Organismos autónomos.<br>Entidades públicas empresariales.<br>Agencias estatales.<br><br>b) Las autoridades administrativas independientes.<br>c) Las sociedades mercantiles estatales.<br>d) Los consorcios.<br>e) Las fundaciones del sector público.<br>f) Los fondos sin personalidad jurídica.<br>g) Las universidades públicas no transferidas."},{id:"extra-1788171900114",nota:70,cat:"A",titulo:"MEDIDAS PRIVATIVAS DE LIBERTAD",body:"Son medidas privativas de libertad:<br><br>1.ª El internamiento en centro psiquiátrico.<br>2.ª El internamiento en centro de deshabituación.<br>3.ª El internamiento en centro educativo especial.<br><br>Son medidas no privativas de libertad:<br><br>1.ª) La inhabilitación profesional.<br>2.ª) La expulsión del territorio nacional de extranjeros no residentes legalmente en España.<br>3.ª) La libertad vigilada.<br>4.ª) La custodia familiar. El sometido a esta medida quedará sujeto al cuidado y vigilancia del familiar que se designe y que acepte la custodia, quien la ejercerá en relación con el Juez de Vigilancia Penitenciaria y sin menoscabo de las actividades escolares o laborales del custodiado.<br>5.ª) La privación del derecho a conducir vehículos a motor y ciclomotores.<br>6.ª) La privación del derecho a la tenencia y porte de armas."},{id:"extra-1788382712556",nota:71,cat:"L",tags:["L"],titulo:"Fuetes del derecho",body:"FUENTE DEL DERECHO:<br>-&gt;DIRECTAS<br>●	LEY → PRIMARIA (TRATADO PUBLICADO TAMBIÉN)<br>●	COSTUMBRE - SECUNDARIA<br>●	PPIOS GENERALES - SECUNDARIA"},{id:"extra-1788382897433",nota:72,cat:"A",tags:["L"],titulo:"VARIOS",body:"●	DECLARACIÓN DE NACIMIENTO: 72 H<br>○	→ FUERA DE HOSPITAL: 10 DÍAS<br>○	→ CAUSA JUSTIFICADA: 30 DÍAS<br>------------------------------------------------------------------<br>●	CAPACIDAD JURÍDICA: ES LA PRIMERA ALFABÉTICAMENTE → NADA MÁS NACER<br>○	① Jurídica ② Obrar<br>●	CAP. OBRAR: +18<br>○	-18 CAP. LIMITADA<br>------------------------------------------------------------------<br>●	DOMICILIO REAL → EL HABITUAL → TU CASA<br>●	DOM. LEGAL / NECESARIO → EL FAMILIAR<br>○	Ej. HIJO QUE VIVE CON SUS PADRES<br>●	EFECTIVO: DISTINTO AL REAL"},{id:"extra-1788383018442",nota:73,cat:"A",tags:["L"],titulo:"VARIOS",body:"MÍNIMO SENADORES GP PARLAMENTARIO:<br>●	10 (SENADO)<br>●	15 (CONGRESO)<br><br>SEGURIDAD PRIVADA<br>●	DESTRUCCIÓN DE IMÁGENES Y SONIDOS DE INVESTIGACIONES → 3 [años]<br>●	INFORMES D. PRIVADO DEBE CONSERVARLO → 3 [años]<br>●	NO PODRÁN EJERCER FUNCIONES DE DIRECCIÓN/ADMINISTRACIÓN EN CENTROS DE FORMACIÓN FCS → 2 [años]<br>●	FCS PODRÁ EJERCER FUNCIONES DE SP → 2 [años]<br>●	INTROMISIÓN ILEGÍTIMA → 5 [años]<br>●	REPRESENT[ACIÓN] LEGAL → 10 [años]"},{id:"extra-1788383260038",nota:74,cat:"A",titulo:"VARIOS",body:"●	PRÁCTICAS TIRO<br>○	VIGILANTE: 6M<br>○	ESCOLTA: 3M<br><br>Si el ATENTADO es contra la AUTORIDAD, SE AGRAVA.<br><br>●	VISADO A - AEROPORTUARIO<br>●	VISADO B - TRÁNSITO<br>●	VISADO C - CORTA DURACIÓN (FRONTERA)<br>●	VISADO D - LARGA DURACIÓN<br><br>AMENAZA LEVE A MUJER O PAREJA -&gt; PRISION"},{id:"extra-1788383311198",nota:75,cat:"A",tags:["L"],titulo:"VARIOS",body:"PNR-SES<br>IPv4 - 32 BITS<br>AGRUPACIÓN DE MUNICIPIOS - ESTATUTOS<br><br>ARITMÉTICO - ALIMENTO (MALTHUS)<br>(Teoría malthusiana: la población crece geométricamente, mientras que los alimentos lo hacen aritméticamente)<br><br>Movimientos ANTIGLOBALIZACIÓN:<br>●	AZUL: VIOLENTO, ANTIFA<br>●	AMARILLO: MANIFEST[ACIONES] NO VIOLENT[AS]<br><br>COMISIÓN UE - INICIATIVA LEGISLATIVA"},{id:"extra-1788383339402",nota:76,cat:"A",tags:["L"],titulo:"VARIOS",body:"Cuando un TRIBUNAL PLANTEE CUESTIÓN DE INCONSTITUCIONALIDAD → NUNCA TENDRÁ EFECTOS SUSPENSIVOS.<br><br>BCI → TRATADO DE ROMA<br><br>INTOXICACIÓN PLENA - EXIMENTE<br><br>BIOLÓGICA → FARMACODINÁMICA<br><br>MIEMBROS DE MISMA NACIONALIDAD DEL SPT → 1<br><br>●	PERSONAL SP → PERSONA FÍSICA [QUE] DESARROLLA FUNCIONES DE SP<br>●	PERSONAL ACREDITADO → PROF[ESIONALES], INGEN[IEROS] Y TÉCNICOS"},{id:"extra-1788383376625",nota:77,cat:"L",tags:["L"],titulo:"VARIOS",body:"MEMORIA RAM APILADA EN 3D, MUCHO ANCHO DE BANDA: HBM<br><br>●	EFECTO HALO: AURA +<br>●	EFECTO DIABLO: AURA -<br>●	EFECTO PIGMALIÓN: EXPECTATIVAS + DE LOS DEMÁS TE IMPULSAN<br><br>PRL - CALIFICACIÓN DEL RIESGO<br>→ PROBABILIDAD Y SEVERIDAD<br><br>MIDE EL SIGNIFICADO AFECTIVO → DIFERENCIAL SEMÁNTICO<br>DGP:<br>●	FALTA DE ASEO: LEVE<br>●	BEBER Y DROGAS DURANTE EL SERVICIO: MUY GRAVE<br>●	NO UNIFORME CUANDO SEA PRECEPTIVO → GRAVE"},{id:"extra-1788383407456",nota:78,cat:"L",titulo:"VARIOS",body:"VICTIMIZACIÓN DE JUECES: → QUINTO NIVEL<br>(nivel 5 = victimización vicaria: funcionarios de la Administración de Justicia)<br><br>POLICÍA SE SINDICA FUERA DE HORARIO Y PREVIA AUTORIZ[ACIÓN]<br>(reuniones sindicales fuera del horario laboral, sin perturbar el servicio y con autorización previa del Jefe de la dependencia)"},{id:"extra-1788539253993",nota:79,cat:"A",tags:["L"],titulo:"ORGANIGRAMA MIR",body:"MINISTERIO INTERIOR.<br>   MANDO SUPERIOR y Dirección y coord FCSE.<br>GABINETE (MIR): (DG)<br>   Director (DG) + 5 asesores (MAX)(SG)<br>   PALABRAS CLAVE:<br>     -PROTOCOLO Y RELACIONES<br>     -PERSONAL CON ASESORAMIENTO CIENTIF ]<br>OFICINA DE COMUNICACIÓN: (SG)<br>     -WEB DEL MINISTERIO<br>     -PORTAVOS, RELACIONES INFO y PUBLICIDAD."},{id:"extra-1788539573812",nota:80,cat:"A",tags:["L"],titulo:"ORGANIGRAMA MIR",body:"SES:<br>    -ADSCRITO: GIESE: COMPRA DE EDIF y ARMAS (Presidente Titular del SES)<br>    -DIRIGE Y COORDINA<br>    -PNR<br>    -ESPECIALMENTE<br>    -SNPIC<br>     -Ejerce MANDO FFCCSSE.<br>     -CCPA (DIRIGE Y COORD)<br>     -COORDINA COMPETENCIAS DEL/SUBD.<br><br>GABINETE DEL SES<br>    Director y MAX 3 ASESORES (SG todos)<br>    EJERCE FUNC DE RELATORIA NAC. CONTRA TRATA<br><br>DEPENDEN DEL SES Y COORD POR GABINETE:<br><br>    -SGPGIMS (GESTIONA y PLANIF. INFRAESTR).<br>    -SGSICS<br>         -EULISA y SIRDEE y SISTEMA SHENGEN<br>         -DIRIGE CETSE (IDENT y NEUTRALIZA DRONES)<br>         -MANTIENE LA WEB (INTRANET) (DOMINIO)<br>DG. RELACIONES INTERNAC.<br>         -FRONTEX<br>         -NCC y NFPOC."},{id:"extra-1788539910818",nota:81,cat:"A",titulo:"ORGANIGRAMA MIR",body:"DIRECCCIÓN G. COOD Y ESTUDIOS.<br><br>   OBSERVATORIO CIBERCRIMINALIDAD.<br>   ESTADISTICA CRIMINALIDAD.<br>   UNIVERSIDAD • CNPIC • SVIOGEN<br>   CEPOL • ON DELITO ODIO • DESAPARECIDOS<br>   OCC (COMO CANAL CSIRT↔SES)<br>   CCPA (COORDINA) • ONVIOSEX<br>   CPIC • OTAN/EU/ESA.<br><br>IPSS<br><br>   PROPONE AL SES PLANIF DE LA ACTIV. INSPECTORA.<br>   PRL<br>   CALIDAD (QUEJAS CIUDADANOS)<br>   CONTROLA PLANES ACTUACIÓN FFCCSS<br>   DEONTOLOGIA<br>   OFICINA GARANTIAS DUDH.<br><br>CITCO <br>   DESTRUCCIÓN DROGAS • COORD EMPACT<br>   UNECI • ACTUACIÓN CONJUNTA FFCCSS • DELINC. ORGANTZ<br>   ONIP • INFORM ANUAL DE AMENAZAS • TERRORISMO<br>   PIU • ESTADISTICA (QUE NO SEA CRIMINALIDAD)<br>   TEPOL • PTO FOCAL TRATA • PTO NAL (FOCAS A CIT(R)CO) →   O.R.A"},{id:"extra-1788540074713",nota:82,cat:"A",titulo:"ORGANIGRAMA MIR",body:"SUBSECRET INTERIOR<br><br>ADSCRITO ABOGACÍA DEL ESTADO INTERV DELEGADA DE AGE.<br>SGT:  → ADSCRITO: CIPAE<br>   QUEJA DEPARTAMENTO.<br>   ARCHIVISTICA Y DOCUMENT.<br>   OF. PRESUP DEPENDE DIRECT⁠' DE LA SUBSECRET.<br>   PRESIDE LA CIAR → DG Protec. INTERN<br>   VENTANILLA ÚNICA (SG APOYO VICTIMAS TERRORISM)<br><br>SECRET. GENERAL PROTECCIÓN CIVIL Y EMERGENCIAS.<br>    DEPENDE DIRECTAMENTE → DIV. TECNOLOGIA. DIRECC GENERA PROTEC. CIVIL Y EMERG.<br>    SG. ANTICIPACION Y PREP (ESCUELA DE P. CIVIL)<br>    SG PLANIF Y GESTION EMERG. (CEIESE) = (DIRIGE CENEM)<br>    SG. RESILIENCIA Y RECUPE."},{id:"extra-1788540271328",nota:83,cat:"A",tags:["L"],titulo:"ORGANIZACIÓN TERRITORIAL DGP",body:"DGP.<br><br>SUPLENCIA DEL DGP → DAO<br><br>RPT - DOTD, DCI, D.DOCUMENTACIÓN<br><br>JUNTA DE GOB: ASIST Y COLAB <br>   PRESI: DGP <br>   VICE: DAO<br>   SECRET: J.DIV DE PERSONAL <br><br>CONSEJO ASESOR: (PERMANENTE) ASESORA, REALIZA INF Y ESTUDIOS. <br>   PRESI: DGP <br>   SECRET: G.TÉCNICO.<br><br>JSP → 20 -- COM.PROVINCIAL → 44 ---C.LOCAL → 126 C.DISTRITO → 63---C.ZONAL → SEGUN NECESIDAD.<br><br>JSP - TIENE UN GABINETE Y SECRET GENERAL SI HAY VARIAS PROVINCIAS TAMBIEN CREA SI ES NECESARIO BRIGADAS REGIONALES <br>NOMBRA: MI x LIBRE ELECCIÓN RANGO → COMISARIO P.PAL"},{id:"extra-1788540425348",nota:84,cat:"A",tags:["L"],titulo:"ORGANIZACION TERRITORIAL DGP",body:'UCOT → DEPENDE DE JSP. → JEFE: JRO (ESTE SUPLE JSP SI ES NECESARIO)<br>    -COORD LAS BRIGADAS REG <br>  → ADSCRITA: UTI<br><br>COMISARIAS PROVINCIALES<br>    -UCOP: PUEDE EXISTIR O NO → JEFE: JPO <br>     Según El Catálogo<br>    -UTO.<br>    -SECRET GENERAL.<br>     -LA PROVINCIA SEDE DEL JSP PUEDE SER DIRECT ASUMIDA x <br><br>EL COMISARIA LOCAL<br>   "LA RIOJA (CCAA) NO TIENE."<br>   CCPA: FR 4 PT 5              CCP: TANGER 1 ALGECIRA 1. <br><br>UD EXTRANJERIA: FUNCIONAL: CGEYF <br>                     ORGÁNICA: BG PROV. <br>UD DOCUMENTACIÓN: FUNCIONAL: D.DOC <br>                         ORGANIC: JSP/COMISARIA'},{id:"extra-1788540445555",nota:85,cat:"A",tags:["L"],titulo:"VARIOS",body:"RECURSO DE AMPARO<br><br>CONTRA:<br><br>EJECUTIVO: 20 DÍAS<br>JUDICIAL: 30 DÍAS<br>LEGISLATIVO: 3 MESES<br><br>ORDEN ALFABÉTICO<br><br>〜〜〜〜〜〜〜〜〜〜〜〜<br><br>PROCEDIMIENTO x FALTAS MUY GRAVES Y GRAVES (RÉGIMEN DISCIPLINARIO)<br><br>INSTRUCCIÓN: 15 DÍAS RESTO DE PLAZOS: 10 DÍAS (DURACIÓN MAX PROCEDIM. 6M)<br>SI ES URGENTE TODOS LOS PLAZOS A LA MITAD EXCEPTO ALEGACIONES. (10 DÍAS)"},{id:"extra-1788540520015",nota:86,cat:"A",tags:["L"],titulo:"VARIOS",body:"SI EL FUNCIONARIO POLICÍA EN SEGUNDA ACTIVIDAD → CON DESTINO (RÉGIMEN CNP) → SIN DESTINO (RÉGIMEN Función pública)<br>------------------------------------------------------------------<br><br>POLICÍA - NOMBRA EL SES POLICÍA ALUMNO - DGP.<br>------------------------------------------------------------------<br><br>FUNCIONES PROPIAS DE FCS (CCAA)<br>    TODAS EN LAS QUE SE DICE CCAA<br><br>EN COLABORACIÓN:<br>   VELAR x LEYES DEL ESTADO<br>   PARTICIPAR FUNC. P. JUDICIAL<br>   VIGILAR ESPACIOS PÚBLICOS...<br><br>SIMULTÁNEA:<br>   RESOLUCIÓN AMISTOSA CONFLICTOS P.V.<br>   AUX EN CATÁSTROFE<br>   CONSERV NATURALEZA"},{id:"extra-1788540599139",nota:87,cat:"A",titulo:"VARIOS",body:"PRESTADORES DE SERV. SP: 1. EMPRESAS, 2. DESP. DET. 3. PERSONAL HABILITADO<br>EMPRESA de SP: PERSONA FÍSICA O JURÍDICA, PRIVADA, AUTORIZADA PARA PRESTAR SERVICIOS.<br>PERSONAL DE SP: PERSONA FÍSICA QUE DESARROLLA FUNCIONES de SP, HABIENDO OBTENIDO LA CORRESP. HABILITACIÓN.<br>PERSONAL ACREDITADO: PROFES CUG Y TÉCNICOS<br>--------------------------------------------------------------<br>SP Actitudes: ÁMBITOS <br>SP SERVICIOS: ACCIONES <br>SP FUNCIONES: FACULTADES <br>SP MEDIDAS: DISPOSICIONES.<br>--------------------------------------------------------------<br>Accidente de trabajo: toda lesión CORPORAL que sufra con ocasión del trabajo.<br>Accidente en Blanco: Accidentes sin lesiones en trabajadores pero sí daños materi.<br>Enfermedad profesional: son las contraídas a cuenta del trabajo x c. propia o ajena (DEBE ESTAR RECOGIDA EN EL CUADRO)<br><br>INCAPACIDAD PERMANENTE<br>   PARCIAL: MENOS DE 33%.<br>   TOTAL: (DE DICHA PROFESIÓN)<br>   ABSOLUTA: (NINGUNA PROFESIÓN)<br>   GRAN INVALIDEZ: ADEMÁS NECESITA ASISTENCIA."},{id:"extra-1789720428594",nota:88,cat:"A",titulo:"IC",body:"Zonas críticas – propuesta de declaración<br>→ Competente: CNPIC (Centro Nacional de Protección de las Infraestructuras Críticas)<br>-------------------------------------------------------------------------------------------------------------<br>Modificación del Plan Nacional de Protección de Infraestructuras Críticas<br>→ Competente: CNPIC<br>-------------------------------------------------------------------------------------------------------------<br>Catálogo Nacional de Infraestructuras Estratégicas<br>→ Responsable: Ministerio de Interior, a través de la Secretaría de Estado de Seguridad<br>-------------------------------------------------------------------------------------------------------------<br>Acceso a la información de los Planes Estratégicos Sectoriales<br>→ Responsable de garantizar el acceso a los agentes del Sistema autorizados: CNPIC<br>-------------------------------------------------------------------------------------------------------------<br>Función del CNPIC respecto al Catálogo Nacional<br>→ Mantener operativo y actualizado el Catálogo<br>OJO<br>Actualización del Plan Nacional de Protección de Infraestructuras Críticas<br>→ Requiere aprobación del: Secretario de Estado de Seguridad"},{id:"extra-1789720448782",nota:89,cat:"A",titulo:"IC",body:"Diseño y dirección de la estrategia nacional de protección de infraestructuras críticas<br>→ Secretaría de Estado de Seguridad<br>-------------------------------------------------------------------------------------------------------------<br>INCIBE<br>→ Depende actualmente de: Ministerio de Transformación Digital y Función Pública<br>-------------------------------------------------------------------------------------------------------------<br>Clasificación de una infraestructura como estratégica<br>→ Responsable: Ministerio del Interior, a través de la Secretaría de Estado de Seguridad<br>-------------------------------------------------------------------------------------------------------------<br>Declaración de zona crítica – informe previo<br>→ Requiere informe previo del: CNPIC<br>-------------------------------------------------------------------------------------------------------------<br>Periodicidad de reunión del Grupo de Trabajo<br>→ Al menos 2 veces al año<br>-------------------------------------------------------------------------------------------------------------<br>Órgano que impulsa, coordina y supervisa las actividades de la Secretaría de Estado de Seguridad en protección de infraestructuras críticas (Ley 8/2011)<br>→ CNPIC"},{id:"extra-1789720464146",nota:90,cat:"A",titulo:"IC",body:"Altas, bajas y modificaciones de infraestructuras en el Catálogo<br>→ Competente: CNPIC<br>-------------------------------------------------------------------------------------------------------------<br>Proponer a la Comisión la creación/modificación/supresión de grupos de trabajo sectoriales o técnicos → Grupo de Trabajo Interdepartamental<br>-------------------------------------------------------------------------------------------------------------<br>Registro central de todos los Planes Estratégicos Sectoriales<br>→ Custodiado por: CNPIC<br>-------------------------------------------------------------------------------------------------------------<br>Punto directo de interlocución de operadores críticos del sector privado con la Secretaría de Estado de Seguridad<br>→ CNPIC<br>-------------------------------------------------------------------------------------------------------------<br>Designación del Responsable de Seguridad y Enlace (Ley 8/2011)<br>→ Encargados: Los operadores críticos<br>-------------------------------------------------------------------------------------------------------------<br>EC3 (Equipo de Delitos Telemáticos / Centro de Ciberseguridad)<br>→ Inicio de actividades: 2013<br>-------------------------------------------------------------------------------------------------------------<br>Plazo para nombrar y comunicar al Responsable de Seguridad y Enlace<br>→ Tres meses"},{id:"extra-1789720476046",nota:91,cat:"A",titulo:"IC",body:"Secretaría de la Comisión Nacional de Protección de Infraestructuras Críticas<br>→ La ostenta: El Director del CNPIC<br>-------------------------------------------------------------------------------------------------------------<br>Activación de los niveles de seguridad (Ley 8/2011)<br>→ Competente: Ministerio del Interior<br>-------------------------------------------------------------------------------------------------------------<br><br>Revisión de los planes de actuación (Ley 8/2011)<br>→ Cada 2 años, excepto el PNPIC (Plan Nacional), que será cada 5 años<br>-------------------------------------------------------------------------------------------------------------<br>Coordinar FCSE ante alerta de seguridad y velar por aplicación del Plan Nacional PIC<br>→ Competencia de: Delegaciones del Gobierno en las CCAA"},{id:"extra-1789720502656",nota:92,cat:"A",titulo:"Agentes del Sistema IC",body:"a) La Secretaría de Estado de Seguridad del Ministerio del Interior.<br>b) El Centro Nacional para la Protección de las Infraestructuras Críticas.<br>c) Los Ministerios y organismos integrados en el Sistema, que serán los incluidos en el anexo de esta Ley.<br>d) Las Comunidades Autónomas y las Ciudades con Estatuto de Autonomía.<br>e) Las Delegaciones del Gobierno en las Comunidades Autónomas y en las Ciudades con Estatuto de Autonomía.<br>f) Las Corporaciones Locales, a través de la asociación de Entidades Locales de mayor implantación a nivel nacional.<br>g) La Comisión Nacional para la Protección de las Infraestructuras Críticas.<br>h) El Grupo de Trabajo Interdepartamental para la Protección de las Infraestructuras Críticas.<br>i) Los operadores críticos del sector público y privado."},{id:"extra-1789737494926",nota:93,cat:"A",tags:["L"],titulo:"Ataques a las conexiones",body:"Redes trampa (Wifi falsas)<br>Spoofing o suplantación<br>IP Spoofing<br>Web Spoofing<br>Email Spoofing<br>DNS Spoofing<br>Ataques a Cookies<br>Ataques DDoS  privativa, igual que inhabilitación profesional, libertad vigilada, custodia familiar y privación de conducir o de armas.",id:"qn4pedf"},{q:"En la medida de custodia familiar, el familiar designado ejerce la custodia en relación con:",opts:["El Juez de Vigilancia Penitenciaria","El Ministerio Fiscal","El Juez de Instrucción","Los servicios sociales del municipio"],correct:0,n:70,e:"El custodio actúa en relación con el Juez de Vigilancia Penitenciaria y sin menoscabo de las actividades escolares o laborales del custodiado.",id:"qb27iqg"},{q:"En el sistema de fuentes del derecho, ¿cómo se clasifica la costumbre?",opts:["Fuente directa secundaria","Fuente directa primaria","Fuente indirecta","Fuente meramente interpretativa"],correct:0,n:71,e:"Fuentes directas: la ley (primaria) y la costumbre y los principios generales (secundarias).",id:"qkpy96t"},{q:"¿Qué tratado internacional tiene la consideración de fuente directa primaria, junto con la ley?",opts:["El tratado ya publicado oficialmente","Todo tratado firmado, aunque no esté publicado","El tratado ratificado pero pendiente de publicar","Solo los tratados de la UE"],correct:0,n:71,e:"El tratado internacional se equipara a la ley como fuente primaria solo una vez publicado.",id:"qostrk3"},{q:"¿En qué plazo debe declararse un nacimiento ocurrido fuera de un hospital?",opts:["10 días","72 horas","30 días","15 días"],correct:0,n:72,e:"72 horas como regla general; 10 días si el parto ocurre fuera del hospital; 30 días si hay causa justificada.",id:"qnlcqh1"},{q:"¿Cuál es el plazo de declaración de nacimiento cuando existe causa justificada?",opts:["30 días","10 días","72 horas","3 meses"],correct:0,n:72,e:"Con causa justificada se amplía a 30 días.",id:"q1egtx8p"},{q:"Un hijo menor que vive con sus padres tiene su domicilio:",opts:["Legal o necesario, el de la familia","Real, por ser su lugar de residencia habitual","Efectivo, al coincidir con el de sus padres","Voluntario, a elección de los padres"],correct:0,n:72,e:"El domicilio real es el habitual (tu casa). El legal o necesario es el familiar. El efectivo es distinto del real.",id:"qy6ukea"},{q:"¿Cuántos senadores como mínimo se exigen para constituir grupo parlamentario en el Senado?",opts:["10","15","5","20"],correct:0,n:73,e:"Senado: 10 senadores. Congreso: 15 diputados.",id:"q1eqh9ih"},{q:"En seguridad privada, ¿durante cuántos años debe conservar un detective privado los informes de investigación?",opts:["3 años","2 años","5 años","10 años"],correct:0,n:73,e:"Informes de detective y destrucción de imágenes y sonidos de investigaciones: 3 años.",id:"q10g0emm"},{q:"¿Cuál de estos plazos se corresponde con la representación legal en seguridad privada?",opts:["10 años","5 años","3 años","2 años"],correct:0,n:73,e:"Representación legal: 10 años. Intromisión ilegítima: 5. Conservación de informes y destrucción de imágenes: 3.",id:"qico1ku"},{q:"¿Cada cuánto deben realizarse las prácticas de tiro del personal de seguridad privada según su categoría?",opts:["Vigilante cada 6 meses y escolta cada 3 meses","Vigilante cada 3 meses y escolta cada 6 meses","Ambos cada 6 meses","Ambos cada 3 meses"],correct:0,n:74,e:"Vigilante: 6 meses. Escolta: 3 meses, por la mayor exigencia de su función.",id:"q1ts6m5m"},{q:"¿Qué tipo de visado es el B?",opts:["De tránsito","Aeroportuario","De corta duración","De larga duración"],correct:0,n:74,e:"A: aeroportuario. B: tránsito. C: corta duración. D: larga duración.",id:"q1eggy5k"},{q:"¿Cuántos bits tiene una dirección IPv4?",opts:["32","64","128","16"],correct:0,n:75,e:"IPv4 usa 32 bits. IPv6 usa 128.",id:"qvkmi76"},{q:"Según la teoría malthusiana, ¿cómo crecen la población y los alimentos?",opts:["La población geométricamente y los alimentos aritméticamente","La población aritméticamente y los alimentos geométricamente","Ambos geométricamente","Ambos aritméticamente"],correct:0,n:75,e:"La población crece más deprisa que los recursos, lo que genera desequilibrio.",id:"qgygsn3"},{q:"En los movimientos antiglobalización, ¿qué corresponde al bloque azul?",opts:["El violento (antifa)","El de manifestaciones no violentas","El de resistencia institucional","El de protesta económica"],correct:0,n:75,e:"Azul: violento, antifa. Amarillo: manifestaciones no violentas.",id:"qvnbq7w"},{q:"Cuando un tribunal plantea una cuestión de inconstitucionalidad, ¿qué efectos suspensivos tiene?",opts:["Nunca tendrá efectos suspensivos","Siempre suspende el proceso","Suspende solo si lo pide una de las partes","Suspende solo en procesos penales"],correct:0,n:76,e:"La cuestión de inconstitucionalidad nunca tiene efectos suspensivos, a diferencia del recurso de inconstitucionalidad del Gobierno contra normas autonómicas.",id:"q1nv3iro"},{q:"La intoxicación plena por alcohol o drogas, ajena a la voluntad de la persona, es:",opts:["Una eximente","Una atenuante","Una agravante","Irrelevante penalmente"],correct:0,n:76,e:"La intoxicación plena exime de responsabilidad criminal. La incompleta atenúa.",id:"q9x9rmq"},{q:"¿Cuántos miembros de la misma nacionalidad puede haber en el Subcomité para la Prevención de la Tortura?",opts:["Uno","Dos","Tres","Ninguno"],correct:0,n:76,e:"No puede haber más de un miembro de la misma nacionalidad.",id:"qi4uoe7"},{q:"¿Qué efecto describe que las expectativas positivas de los demás te impulsan a rendir más?",opts:["Efecto Pigmalión","Efecto halo","Efecto diablo","Efecto Golem"],correct:0,n:77,e:"Pigmalión: expectativas positivas impulsan. Halo: aura positiva. Diablo: aura negativa.",id:"q1fc3nzk"},{q:"¿Qué instrumento mide el significado afectivo de los conceptos?",opts:["El diferencial semántico","La escala Likert","El sociograma","La escala de Bogardus"],correct:0,n:77,e:"El diferencial semántico mide el significado afectivo o connotativo.",id:"q1g11ukg"},{q:"En prevención de riesgos laborales, ¿qué factores determinan la calificación del riesgo?",opts:["Probabilidad y severidad","Frecuencia y antigüedad","Gravedad y coste","Exposición y edad del trabajador"],correct:0,n:77,e:"El riesgo se califica combinando probabilidad de que ocurra y severidad de sus consecuencias.",id:"qjz9622"},{q:"En el régimen disciplinario de la Policía, ¿cómo se califica beber y consumir drogas durante el servicio?",opts:["Falta muy grave","Falta grave","Falta leve","Falta grave si es reiterada"],correct:0,n:77,e:"Beber y drogas durante el servicio es muy grave. No usar uniforme cuando es preceptivo es grave. La falta de aseo es leve.",id:"q1c4rthm"},{q:"En la victimización, ¿qué nivel corresponde a los jueces y funcionarios de la Administración de Justicia?",opts:["Quinto nivel (victimización vicaria)","Primer nivel","Segundo nivel","Cuarto nivel"],correct:0,n:78,e:"El nivel 5 es la victimización vicaria de los funcionarios de la Administración de Justicia.",id:"q1g4oyfc"},{q:"Las reuniones sindicales de los policías requieren:",opts:["Fuera del horario laboral, sin perturbar el servicio y con autorización previa del Jefe de la dependencia","Solo aviso previo al Jefe de la dependencia","Autorización del Director General de la Policía","Autorización del Delegado del Gobierno"],correct:0,n:78,e:"Se celebran fuera del horario laboral, sin perturbar el servicio y con autorización previa del Jefe de la dependencia.",id:"q19rz60l"},{q:"¿Cuántos asesores como máximo tiene el Gabinete del Ministro del Interior, además de su director?",opts:["5","3","4","7"],correct:0,n:79,e:"El Gabinete del Ministro tiene director más 5 asesores como máximo. El del Secretario de Estado de Seguridad tiene 3.",id:"qgm37v6"},{q:"¿Qué nivel orgánico tiene la Oficina de Comunicación del Ministerio del Interior?",opts:["Subdirección General","Dirección General","Secretaría General Técnica","Servicio de la Subsecretaría"],correct:0,n:79,e:"Es una subdirección general: gestiona la web del Ministerio, portavoces, relaciones informativas y publicidad.",id:"q1eqm1jv"},{q:"¿Cuántos asesores como máximo tiene el Gabinete del Secretario de Estado de Seguridad?",opts:["3","5","4","2"],correct:0,n:80,e:"Director y máximo 3 asesores, todos con nivel de subdirector general.",id:"qkcu0sz"},{q:"¿Qué órgano del Secretario de Estado de Seguridad dirige el CETSE, que identifica y neutraliza drones?",opts:["La Subdirección General de Sistemas de Información y Comunicaciones para la Seguridad","La Dirección General de Relaciones Internacionales","El Gabinete del Secretario de Estado","La Subdirección General de Planificación de Infraestructuras"],correct:0,n:80,e:"La SGSICS dirige el CETSE, mantiene la intranet y gestiona sistemas como EU-LISA, SIRDEE y Schengen.",id:"q1rxt14f"},{q:"¿Qué órgano del Secretario de Estado de Seguridad ejerce las funciones de Relatoría Nacional contra la Trata?",opts:["El Gabinete del Secretario de Estado","El CITCO","La Dirección General de Relaciones Internacionales","La Subdirección General de Sistemas de Información"],correct:0,n:80,e:"Las ejerce el Gabinete del SES.",id:"qipyoqx"},{q:"¿Qué órgano lleva la estadística de la criminalidad y el Observatorio de Cibercriminalidad?",opts:["La Dirección General de Coordinación y Estudios","El CITCO","La Inspección de Personal y Servicios de Seguridad","El Gabinete del Secretario de Estado"],correct:0,n:81,e:"La DGCYE lleva estadística de criminalidad, observatorios, delitos de odio y desaparecidos. El CITCO lleva la estadística que no sea de criminalidad.",id:"q1isgw9q"},{q:"¿Qué órgano actúa como canal entre el CSIRT y la Secretaría de Estado de Seguridad en materia cibernética?",opts:["La Oficina de Coordinación Cibernética","El CNPIC","El CITCO","La SGSICS"],correct:0,n:81,e:"La OCC depende de la DGCYE y actúa como canal CSIRT ↔ SES.",id:"qfg0p22"},{q:"¿Cuál de estas funciones corresponde al CITCO?",opts:["Coordinar EMPACT y gestionar el PIU","Custodiar el registro de Planes Estratégicos Sectoriales","Proponer la planificación de la actividad inspectora","Mantener el Observatorio de Cibercriminalidad"],correct:0,n:81,e:"CITCO: destrucción de drogas, EMPACT, PIU, terrorismo, crimen organizado y punto focal de trata.",id:"q4td5mm"},{q:"¿Qué órgano propone al Secretario de Estado de Seguridad la planificación de la actividad inspectora?",opts:["La Inspección de Personal y Servicios de Seguridad (IPSS)","La Dirección General de Coordinación y Estudios","El CITCO","La Subsecretaría del Interior"],correct:0,n:81,e:"La IPSS propone la planificación inspectora y se ocupa de PRL, calidad, quejas, deontología y garantías de derechos humanos.",id:"q1kr6d8f"},{q:"¿Quién depende directamente de la Subsecretaría del Interior?",opts:["La Oficina Presupuestaria","La Escuela Nacional de Protección Civil","El CENEM","La Ventanilla Única"],correct:0,n:82,e:"La oficina presupuestaria depende directamente de la Subsecretaría.",id:"q1mav1kr"},{q:"¿En qué subdirección se integra la Escuela Nacional de Protección Civil?",opts:["Anticipación y Preparación","Planificación y Gestión de Emergencias","Resiliencia y Recuperación","Secretaría General Técnica"],correct:0,n:82,e:"Anticipación y Preparación alberga la Escuela. Planificación y Gestión de Emergencias dirige el CENEM.",id:"q1439z03"},{q:"¿Qué subdirección de Protección Civil dirige el CENEM?",opts:["Planificación y Gestión de Emergencias","Anticipación y Preparación","Resiliencia y Recuperación","La División de Tecnología"],correct:0,n:82,e:"Planificación y Gestión de Emergencias (CEIESE) dirige el CENEM.",id:"qcz73nb"},{q:"En la DGP, ¿quién suple al Director General?",opts:["El Director Adjunto Operativo","El Jefe de la División de Personal","El Secretario General Técnico","El Jefe del Gabinete Técnico"],correct:0,n:83,e:"El DAO suple al DGP y es vicepresidente de la Junta de Gobierno.",id:"qa9548w"},{q:"En la Junta de Gobierno de la DGP, ¿quién ejerce la secretaría?",opts:["El Jefe de la División de Personal","El Jefe del Gabinete Técnico","El Director Adjunto Operativo","El Jefe de la División de Documentación"],correct:0,n:83,e:"Junta de Gobierno: preside el DGP, vice el DAO, secretario el jefe de la División de Personal.",id:"qhlgkbs"},{q:"En el Consejo Asesor de la DGP, ¿quién ejerce la secretaría?",opts:["El Gabinete Técnico","La División de Personal","El DAO","La Secretaría General de la DGP"],correct:0,n:83,e:"Consejo Asesor: preside el DGP y actúa de secretario el Gabinete Técnico.",id:"q7al7m2"},{q:"¿Cuántas Comisarías Provinciales hay?",opts:["44","20","126","63"],correct:0,n:83,e:"20 Jefaturas Superiores, 44 Comisarías Provinciales, 126 Locales y 63 de Distrito. Las zonales, según necesidad.",id:"q1po1v82"},{q:"El Jefe Superior de Policía es nombrado por el Ministro del Interior por libre designación entre:",opts:["Comisarios principales","Comisarios","Inspectores jefes","Cualquier escala ejecutiva"],correct:0,n:83,e:"Nombra el Ministro del Interior por libre designación con rango de Comisario Principal.",id:"q1ucuwew"},{q:"¿Quién es el jefe de la UCOT, que suple al Jefe Superior de Policía cuando es necesario?",opts:["El Jefe Regional Operativo (JRO)","El Jefe Provincial Operativo (JPO)","El Secretario General","El Jefe de la UTI"],correct:0,n:84,e:"La UCOT depende del JSP, su jefe es el JRO y suple al JSP si hace falta. La UTI se adscribe a ella.",id:"qtwseeu"},{q:"¿Qué caracteriza a la UCOP en las Comisarías Provinciales?",opts:["Puede existir o no según el Catálogo, y su jefe es el JPO","Existe siempre y su jefe es el JRO","Existe solo en la provincia sede de la Jefatura Superior","Se crea a propuesta del Delegado del Gobierno"],correct:0,n:84,e:"La UCOP es facultativa según el Catálogo. Su jefe es el JPO.",id:"q12ciub5"},{q:"¿Cuántos Centros de Cooperación Policial y Aduanera hay con Portugal?",opts:["5","4","1","3"],correct:0,n:84,e:"CCPA: 4 con Francia y 5 con Portugal. CCP: uno en Tánger y otro en Algeciras.",id:"qkiw2ok"},{q:"En las unidades de Extranjería de las comisarías provinciales, ¿de quién dependen funcional y orgánicamente?",opts:["Funcionalmente de la CGEYF y orgánicamente de la Brigada Provincial","Funcionalmente de la Brigada Provincial y orgánicamente de la CGEYF","Ambas de la Brigada Provincial","Ambas del Jefe Superior"],correct:0,n:84,e:"Extranjería: funcional CGEYF, orgánica Brigada Provincial. Documentación: funcional División de Documentación, orgánica JSP o comisaría.",id:"qx70z47"},{q:"¿Cuál es el plazo para interponer recurso de amparo contra una resolución judicial?",opts:["30 días","20 días","3 meses","15 días"],correct:0,n:85,e:"Ejecutivo: 20 días. Judicial: 30 días. Legislativo: 3 meses.",id:"q1rhpq10"},{q:"¿Cuál es el plazo del recurso de amparo frente a decisiones del poder legislativo?",opts:["3 meses","20 días","30 días","1 mes"],correct:0,n:85,e:"Contra actos del legislativo: 3 meses. Contra el ejecutivo: 20 días.",id:"q1fhl1yt"},{q:"En el procedimiento disciplinario por faltas graves y muy graves urgente, ¿qué plazo NO se reduce a la mitad?",opts:["El de alegaciones (10 días)","El de instrucción","El de resolución","Ninguno, todos se reducen"],correct:0,n:85,e:"Si es urgente, todos los plazos se reducen a la mitad excepto el de alegaciones. La instrucción es de 15 días y el resto de 10, con máximo de 6 meses.",id:"qm2w9ko"},{q:"Un policía en segunda actividad, ¿qué régimen se le aplica si tiene destino?",opts:["El régimen del CNP","El de la función pública general","El de las Fuerzas Armadas","Ninguno especial"],correct:0,n:86,e:"Con destino aplica el régimen del CNP. Sin destino, el de la función pública.",id:"q4ezdke"},{q:"¿Quién nombra a los policías alumnos?",opts:["El Director General de la Policía","El Secretario de Estado de Seguridad","El Ministro del Interior","El Subdirector de Formación"],correct:0,n:86,e:"A los policías los nombra el SES y a los policías alumnos el DGP.",id:"q11x0tpq"},{q:"¿Cuál de estas funciones se ejerce de forma simultánea entre Cuerpos de Policía y las de las Comunidades Autónomas?",opts:["Auxilio en catástrofes","Velar por el cumplimiento de las leyes del Estado","Participar en funciones de policía judicial","Vigilar espacios públicos"],correct:0,n:86,e:"Simultáneas: resolución amistosa de conflictos, auxilio en catástrofes y conservación de la naturaleza. Las otras son en colaboración.",id:"q1kwws7c"},{q:"¿Qué incapacidad permanente inhabilita para toda profesión?",opts:["Absoluta","Total","Parcial","Gran invalidez"],correct:0,n:87,e:"Total: inhabilita para la profesión habitual. Absoluta: para ninguna profesión. Gran invalidez: además necesita asistencia.",id:"q1rq3qu4"},{q:"¿Cuál es la diferencia entre incapacidad permanente absoluta y gran invalidez?",opts:["En la gran invalidez se necesita además asistencia de otra persona","La gran invalidez solo afecta a la profesión habitual","La absoluta exige necesariamente un 33% de merma","La gran invalidez es temporal"],correct:0,n:87,e:"La gran invalidez añade la necesidad de asistencia de otra persona para los actos esenciales.",id:"q1wkl7gn"},{q:"En la ley de seguridad privada, ¿qué son los servicios?",opts:["Acciones","Ámbitos","Facultades","Disposiciones"],correct:0,n:87,e:"Actividades: ámbitos. Servicios: acciones. Funciones: facultades. Medidas: disposiciones.",id:"q1k1pd6t"},{q:"¿En qué año inició sus actividades el EC3 de Europol?",opts:["2013","2010","2015","2011"],correct:0,n:90,e:"El Centro Europeo de Ciberdelincuencia (EC3) comenzó en 2013.",id:"q4hzfwc"},{q:"¿Cuál es el plazo para nombrar y comunicar al Responsable de Seguridad y Enlace en infraestructuras críticas?",opts:["Tres meses","Un mes","Seis meses","Dos meses"],correct:0,n:90,e:"Los operadores críticos lo designan en tres meses (Ley 8/2011).",id:"qakvjn5"},{q:"¿Cada cuánto se revisan los planes de actuación de la Ley 8/2011 y el Plan Nacional PIC?",opts:["Los planes cada 2 años y el PNPIC cada 5","Todos cada 2 años","Los planes cada 5 años y el PNPIC cada 2","Todos cada 5 años"],correct:0,n:91,e:"Cada 2 años, salvo el Plan Nacional (PNPIC), que se revisa cada 5.",id:"q10a2ta4"},{q:"¿Cuál de los siguientes ataques NO es una modalidad de spoofing?",opts:["Sniffing","IP spoofing","DNS spoofing","Email spoofing"],correct:0,n:93,e:"Spoofing (suplantación): IP, web, email y DNS. El sniffing es captura pasiva de tráfico.",id:"qcloux"},{q:"¿Cómo se denomina también el ataque que intercepta la comunicación entre dos partes sin que lo sepan?",opts:["Man in the middle","Escaneo de puertos","Inyección SQL","Ataque DDoS"],correct:0,n:93,e:"Man in the middle o ataque de intermediario.",id:"qp3a4nf"},{q:"¿Quiénes son responsables criminalmente del delito?",opts:["Autores y cómplices","Autores, cómplices y encubridores","Solo los autores","Autores y cooperadores necesarios"],correct:0,n:94,e:"Solo autores y cómplices. Son autores todos los demás participantes, excepto el cómplice.",id:"q1s2mkf4"},{q:"¿Cómo se trata el encubrimiento?",opts:["Como delito autónomo","Como forma de complicidad","Como forma de autoría","Como agravante del delito encubierto"],correct:0,n:94,e:"El encubrimiento es un delito autónomo y no una forma de participación.",id:"q1luloha"},{q:"¿Qué órgano lleva la información estadística sobre la evolución de la criminalidad?",opts:["La DGCYE","El CITCO","El CNPIC","La IPSS"],correct:0,n:55,e:"Datos sueltos: DGCYE (estadística de criminalidad). DARPA pertenece al Departamento de Defensa de EEUU.",id:"quwnnwf"},{q:"En el Código Penal, ¿cómo se compara la pena de la inducción al suicidio con la de la cooperación necesaria?",opts:["La inducción se pena más","La cooperación necesaria se pena más","Se penan igual","Solo se pena la inducción"],correct:0,n:55,e:"La inducción al suicidio se castiga más que la cooperación necesaria.",id:"qh96g2i"},{q:"¿Qué caracteriza al sistema operativo MS-DOS?",opts:["Monotarea y monousuario","Multitarea y monousuario","Monotarea y multiusuario","Multitarea y multiusuario"],correct:0,n:56,e:"MS-DOS es monotarea y monousuario. Un rootkit es software malicioso de control total.",id:"q1n6bruy"},{q:"En prevención de riesgos laborales, ¿con quién debe consultar el empresario las decisiones preventivas?",opts:["Con los representantes de los trabajadores","Con la Inspección de Trabajo","Con el servicio de prevención ajeno","Con la mutua de accidentes"],correct:0,n:56,e:"El empresario consulta las decisiones preventivas con los representantes de los trabajadores.",id:"q1hia50v"},{q:"Antes de iniciar la conducción, ¿qué se ajusta en primer lugar?",opts:["La altura del asiento","El respaldo","Los retrovisores","El cinturón"],correct:0,n:60,e:"Orden: altura del asiento, respaldo, distancia a pedales y volante, reposacabezas, volante, retrovisores y cinturón.",id:"q1l3ovtg"},{q:"¿Qué se ajusta inmediatamente antes de los retrovisores en la posición de conducción?",opts:["La posición del volante","El reposacabezas","El cinturón","La inclinación del respaldo"],correct:0,n:60,e:"Tras el reposacabezas se ajusta el volante, luego los retrovisores y por último el cinturón.",id:"q1nky22i"},{q:"¿Qué órgano es competente para proponer la declaración de una zona crítica?",opts:["El CNPIC","La Comisión Nacional para la Protección de Infraestructuras Críticas","La Delegación del Gobierno","El operador crítico afectado"],correct:0,n:88,e:"La propuesta de declaración de una zona crítica corresponde al Centro Nacional para la Protección de las Infraestructuras Críticas (CNPIC).",id:"q192cx2n"},{q:"¿Qué órgano debe garantizar el acceso a la información de los Planes Estratégicos Sectoriales a los agentes autorizados del Sistema?",opts:["El CNPIC","La Secretaría General Técnica","El operador crítico","La Comisión Nacional"],correct:0,n:88,e:"El CNPIC garantiza el acceso de los agentes autorizados a la información de los Planes Estratégicos Sectoriales.",id:"q1c3jthg"},{q:"¿Qué órgano mantiene operativo y actualizado el Catálogo Nacional de Infraestructuras Estratégicas?",opts:["El CNPIC","La Secretaría de Estado de Seguridad","El Ministerio de Transformación Digital","Las Delegaciones del Gobierno"],correct:0,n:88,e:"El CNPIC mantiene operativo y actualizado el Catálogo Nacional.",id:"q9zsdap"},{q:"¿Quién aprueba la actualización del Plan Nacional de Protección de Infraestructuras Críticas?",opts:["El Secretario de Estado de Seguridad","El Director del CNPIC","El Ministro del Interior","La Comisión Nacional"],correct:0,n:88,e:"La actualización del PNPIC requiere la aprobación del Secretario de Estado de Seguridad.",id:"q2e7zzx"},{q:"¿A quién corresponde diseñar y dirigir la estrategia nacional de protección de infraestructuras críticas?",opts:["A la Secretaría de Estado de Seguridad","Al CNPIC","A la Comisión Nacional","Al Ministerio de Transformación Digital"],correct:0,n:89,e:"La estrategia nacional de protección de infraestructuras críticas se diseña y dirige desde la Secretaría de Estado de Seguridad.",id:"q1ehxeh8"},{q:"¿De qué ministerio depende actualmente el INCIBE según el post-it?",opts:["Del Ministerio de Transformación Digital y Función Pública","Del Ministerio del Interior","Del Ministerio de Defensa","Del Ministerio de Industria y Turismo"],correct:0,n:89,e:"El INCIBE depende actualmente del Ministerio de Transformación Digital y Función Pública.",id:"quhilmx"},{q:"¿Quién clasifica una infraestructura como estratégica?",opts:["El Ministerio del Interior, a través de la Secretaría de Estado de Seguridad","El CNPIC de forma autónoma","La Comisión Nacional","La Delegación del Gobierno correspondiente"],correct:0,n:89,e:"La clasificación como infraestructura estratégica corresponde al Ministerio del Interior a través de la SES.",id:"q1ucg1ws"},{q:"Antes de declarar una zona crítica, ¿qué informe previo se requiere?",opts:["El del CNPIC","El de la Comisión Nacional","El de la Delegación del Gobierno","El del operador crítico"],correct:0,n:89,e:"La declaración de zona crítica exige informe previo del CNPIC.",id:"qgz834u"},{q:"¿Con qué frecuencia mínima se reúne el Grupo de Trabajo de protección de infraestructuras críticas?",opts:["Al menos dos veces al año","Una vez al año","Cada trimestre","Cada dos años"],correct:0,n:89,e:"El Grupo de Trabajo se reúne, como mínimo, dos veces al año.",id:"q1n4du83"},{q:"¿Qué órgano impulsa, coordina y supervisa las actividades de la SES en protección de infraestructuras críticas?",opts:["El CNPIC","La Comisión Nacional","El Grupo de Trabajo Interdepartamental","El INCIBE"],correct:0,n:89,e:"Según la Ley 8/2011, esa función corresponde al CNPIC.",id:"q10iq5tc"},{q:"¿Qué órgano tramita las altas, bajas y modificaciones de infraestructuras en el Catálogo?",opts:["El CNPIC","La Secretaría de Estado de Seguridad","La Comisión Nacional","El operador crítico"],correct:0,n:90,e:"Las altas, bajas y modificaciones del Catálogo competen al CNPIC.",id:"qzd5sqa"},{q:"¿Quién puede proponer a la Comisión la creación, modificación o supresión de grupos de trabajo sectoriales o técnicos?",opts:["El Grupo de Trabajo Interdepartamental","El CNPIC","El operador crítico","La Delegación del Gobierno"],correct:0,n:90,e:"La propuesta corresponde al Grupo de Trabajo Interdepartamental para la Protección de las Infraestructuras Críticas.",id:"qmtam93"},{q:"¿Qué órgano custodia el registro central de todos los Planes Estratégicos Sectoriales?",opts:["El CNPIC","La Secretaría de Estado de Seguridad","La Comisión Nacional","El Ministerio de Defensa"],correct:0,n:90,e:"El registro central de los Planes Estratégicos Sectoriales está custodiado por el CNPIC.",id:"qi87m7n"},{q:"¿Cuál es el punto directo de interlocución de los operadores críticos privados con la Secretaría de Estado de Seguridad?",opts:["El CNPIC","La Comisión Nacional","La Delegación del Gobierno","El Grupo de Trabajo Interdepartamental"],correct:0,n:90,e:"El CNPIC actúa como interlocutor directo del sector privado con la SES.",id:"qsoo34h"},{q:"¿Quién debe designar al Responsable de Seguridad y Enlace en infraestructuras críticas?",opts:["Los operadores críticos","El CNPIC","La Secretaría de Estado de Seguridad","La Comisión Nacional"],correct:0,n:90,e:"La designación corresponde a los operadores críticos; deben nombrarlo y comunicarlo en el plazo de tres meses.",id:"qn7i46p"},{q:"¿Quién ostenta la secretaría de la Comisión Nacional para la Protección de Infraestructuras Críticas?",opts:["El Director del CNPIC","El Secretario de Estado de Seguridad","El Ministro del Interior","El Delegado del Gobierno"],correct:0,n:91,e:"La secretaría de la Comisión Nacional la ostenta el Director del CNPIC.",id:"q5k716"},{q:"¿Qué órgano activa los niveles de seguridad previstos en la Ley 8/2011?",opts:["El Ministerio del Interior","La Secretaría de Estado de Seguridad","El CNPIC","Las Delegaciones del Gobierno"],correct:0,n:91,e:"La activación de los niveles de seguridad corresponde al Ministerio del Interior.",id:"qgn8aal"},{q:"Ante una alerta de seguridad, ¿quién coordina a las Fuerzas y Cuerpos de Seguridad y vela por aplicar el PNPIC en las CCAA?",opts:["Las Delegaciones del Gobierno","El CNPIC","Los operadores críticos","La Comisión Nacional"],correct:0,n:91,e:"Esa coordinación territorial corresponde a las Delegaciones del Gobierno en las comunidades autónomas.",id:"q118xt3u"},{q:"¿Cuál de los siguientes es un agente del Sistema de Protección de Infraestructuras Críticas?",opts:["La Comisión Nacional para la Protección de Infraestructuras Críticas","El Consejo General del Poder Judicial","El Tribunal Constitucional","La Fiscalía General del Estado"],correct:0,n:92,e:"La Comisión Nacional forma parte de los agentes del Sistema, igual que la SES, el CNPIC, las administraciones territoriales y los operadores críticos.",id:"q9n3yy8"},{q:"¿Cómo participan las corporaciones locales en el Sistema de Protección de Infraestructuras Críticas?",opts:["A través de la asociación de entidades locales de mayor implantación nacional","Solo mediante las diputaciones provinciales","A través del CNPIC directamente","No participan en el Sistema"],correct:0,n:92,e:"Las corporaciones locales participan a través de la asociación de entidades locales de mayor implantación a escala nacional.",id:"q1plnudn"},{q:"¿Qué operadores son agentes del Sistema de Protección de Infraestructuras Críticas?",opts:["Los operadores críticos de los sectores público y privado","Solo los operadores privados","Solo las empresas públicas estatales","Únicamente los operadores declarados estratégicos por las CCAA"],correct:0,n:92,e:"Son agentes del Sistema los operadores críticos tanto públicos como privados.",id:"q14fytof"},{q:"¿Qué representación territorial del Estado forma parte del Sistema de Protección de Infraestructuras Críticas?",opts:["Las Delegaciones del Gobierno en CCAA y ciudades con estatuto de autonomía","Las audiencias provinciales","Las diputaciones provinciales","Los cabildos insulares"],correct:0,n:92,e:"Las Delegaciones del Gobierno son agentes expresamente incluidos en el Sistema.",id:"q3fy4y9"},{q:"¿Cómo se denominan las redes Wi-Fi falsas creadas para atraer a las víctimas?",opts:["Redes trampa","Redes espejo","Redes de respaldo","Redes privadas virtuales"],correct:0,n:93,e:"Las redes trampa son Wi-Fi falsas diseñadas para captar conexiones de las víctimas.",id:"q98i4fe"},{q:"¿Qué ataque busca saturar un servicio mediante tráfico distribuido desde múltiples equipos?",opts:["Un ataque DDoS","Un ataque de cookies","Un escaneo de puertos","Un web spoofing"],correct:0,n:93,e:"Un DDoS distribuye tráfico desde múltiples equipos para impedir o degradar el servicio.",id:"q1c75eoa"},{q:"¿Qué ataque introduce código malicioso en consultas a una base de datos?",opts:["La inyección SQL","El sniffing","El DNS spoofing","El escaneo de puertos"],correct:0,n:93,e:"La inyección SQL manipula consultas para acceder, alterar o extraer datos de una base de datos.",id:"qbigrbg"},{q:"¿Qué técnica consiste en buscar puertos abiertos de un sistema?",opts:["El escaneo de puertos","El man in the middle","El email spoofing","El ataque DDoS"],correct:0,n:93,e:"El escaneo de puertos identifica los puertos abiertos y los servicios potencialmente expuestos.",id:"q1bwsbzp"},{q:"¿Sobre qué elemento se centra un ataque de cookies?",opts:["Sobre las cookies almacenadas por el navegador","Sobre los puertos físicos del equipo","Sobre el servidor DNS","Sobre el cableado de red"],correct:0,n:93,e:"Los ataques a cookies se dirigen a las cookies que el navegador almacena para una sesión o sitio web.",id:"q1lmoq39"},{q:"En la reforma ordinaria de la Constitución, ¿qué mayoría se exige con carácter principal en cada Cámara?",opts:["Tres quintos","Mayoría absoluta","Dos tercios","Mayoría simple"],correct:0,n:95,e:"El artículo 167 CE exige, con carácter principal, una mayoría de tres quintos de cada Cámara.",id:"qlclszr"},{q:"Si no hay acuerdo en una reforma ordinaria tras la mediación de la Comisión Mixta, ¿qué combinación permite desbloquearla?",opts:["Dos tercios del Congreso y mayoría absoluta del Senado","Tres quintos del Congreso y dos tercios del Senado","Mayoría absoluta en ambas Cámaras","Dos tercios en ambas Cámaras"],correct:0,n:95,e:"El desbloqueo previsto en el artículo 167 exige dos tercios del Congreso y mayoría absoluta del Senado.",id:"qqk15l6"},{q:"¿Cuándo puede solicitarse referéndum en una reforma ordinaria?",opts:["Si lo pide una décima parte de cualquiera de las Cámaras dentro de los 15 días siguientes","Siempre, de forma obligatoria","Solo si lo solicita el Gobierno","Si lo pide una tercera parte del Congreso"],correct:0,n:95,e:"El referéndum ordinario es facultativo: lo puede pedir un décimo de cualquier Cámara en los 15 días siguientes.",id:"q89xkf3"},{q:"¿Qué supuesto exige el procedimiento de reforma agravada del artículo 168 CE?",opts:["La revisión total de la Constitución","La modificación de cualquier ley orgánica","La aprobación de un decreto-ley","La reforma de un reglamento parlamentario"],correct:0,n:95,e:"La reforma agravada se aplica, entre otros supuestos, a la revisión total de la Constitución y a materias constitucionalmente blindadas.",id:"q1fbnvb2"},{q:"Tras la aprobación inicial de una reforma agravada por dos tercios de cada Cámara, ¿qué debe ocurrir?",opts:["Se disuelven las Cortes y se convocan nuevas elecciones","Se convoca una comisión mixta sin disolver las Cámaras","El Senado aprueba el texto por mayoría absoluta","El Rey decide si continúa la tramitación"],correct:0,n:95,e:"La reforma agravada exige disolver las Cortes y elegir nuevas Cámaras antes de la aprobación definitiva.",id:"q5fe8p9"},{q:"¿Cómo es el referéndum en la reforma agravada de la Constitución?",opts:["Obligatorio","Facultativo a petición de un décimo","Facultativo a petición del Gobierno","Innecesario si hay unanimidad"],correct:0,n:95,e:"El artículo 168 exige referéndum obligatorio tras la aprobación definitiva.",id:"qvlktda"},{q:"¿En cuál de estas situaciones no puede iniciarse una reforma constitucional?",opts:["Durante un estado de alarma","Durante una sesión ordinaria de las Cortes","Durante el mes de agosto","Durante una campaña electoral municipal"],correct:0,n:95,e:"El artículo 169 prohíbe iniciar la reforma en tiempo de guerra o bajo los estados de alarma, excepción o sitio.",id:"q1dk6w6p"},{q:"¿Cuál de estas comprobaciones puede no estar conforme antes de iniciar el servicio sin que, por sí sola, haga no apto el servicio?",opts:["La higiene y desinfección del vehículo policial","El estado del armamento asignado","La vigencia del permiso de conducción","La disponibilidad del conductor"],correct:0,n:96,e:"El post-it exceptúa la higiene y desinfección, y la comprobación de complementos y herramientas, de las no conformidades que por sí solas hacen no apto el servicio.",id:"q134nxe1"},{q:"¿Quién debe dejar constancia del estado e incidencias del vehículo en los libros correspondientes?",opts:["Los propios conductores, al inicio y al final del servicio","El jefe de la unidad, una vez por semana","El personal de mantenimiento, al terminar cada mes","La sala operativa antes de asignar el vehículo"],correct:0,n:96,e:"Los conductores anotan el estado e incidencias en el Libro de Servicio de la Unidad y en el Libro de Control de Vehículos y Material, tanto al inicio como al final.",id:"q1m2l69t"},{q:"Como norma general, ¿qué no incluyen los medios de defensa reglamentarios del personal uniformado de seguridad privada?",opts:["Armas de fuego","Defensas reglamentarias","El distintivo del cargo","El uniforme"],correct:0,n:97,e:"La regla general es que los medios de defensa reglamentarios no incluyen armas de fuego.",id:"q1lxlpjf"},{q:"¿En cuál de estos servicios constituye excepción a la regla general la prestación con armas de fuego?",opts:["El transporte de dinero, títulos-valores, joyas u objetos valiosos","La vigilancia ordinaria de un comercio","El control de accesos en una oficina privada","La ronda interior de un aparcamiento"],correct:0,n:97,e:"El almacenamiento, recuento, clasificación y transporte de valores y objetos valiosos es una de las excepciones.",id:"q7rcbo5"},{q:"¿Qué actividad vinculada a armas y explosivos permite portar armas de fuego al personal de seguridad privada?",opts:["La vigilancia de fábricas, depósitos o transportes de armas, cartuchería metálica y explosivos","La reparación de armas en un taller privado","La compraventa de armas históricas entre particulares","La custodia de documentación administrativa"],correct:0,n:97,e:"Son excepción las fábricas, depósitos y transporte de armas, cartuchería metálica y explosivos.",id:"q1v7bj92"},{q:"¿En qué buques puede constituir excepción el servicio armado de seguridad privada?",opts:["En mercantes y pesqueros españoles que naveguen en aguas de grave riesgo de piratería u otras amenazas","En cualquier embarcación de recreo española","Solo en buques militares","En buques extranjeros atracados en puertos españoles"],correct:0,n:97,e:"La excepción se refiere a buques mercantes y pesqueros de bandera española en aguas de grave riesgo.",id:"q15qlfis"},{q:"¿Cuál de estas instalaciones figura como excepción para la prestación armada de seguridad privada?",opts:["Un centro de internamiento de extranjeros","Una biblioteca municipal","Una comunidad de vecinos","Una academia privada"],correct:0,n:97,e:"Entre las excepciones están los centros penitenciarios, CIE, establecimientos militares, infraestructuras críticas y otros edificios públicos.",id:"q1kl7s6f"},{q:"¿Cuándo puede perder la nacionalidad española quien no sea español de origen según el supuesto del post-it?",opts:["Al usar exclusivamente durante tres años la nacionalidad a la que declaró renunciar","Al residir tres años fuera de España","Al adquirir una segunda nacionalidad durante un año","Al no renovar el DNI en tres años"],correct:0,n:98,e:"La pérdida se produce si utiliza exclusivamente durante tres años la nacionalidad a la que declaró renunciar al adquirir la española.",id:"q62h4mj"},{q:"¿Cuál es la duración del mandato de los consejeros del Consejo de Policía?",opts:["Cuatro años","Dos años","Cinco años","Seis años"],correct:0,n:98,e:"El mandato de los consejeros del Consejo de Policía dura cuatro años.",id:"qv7ek79"},{q:"¿Cuándo prescribe una pena de cinco a diez años?",opts:["A los diez años","A los cinco años","A los quince años","A los veinte años"],correct:0,n:98,e:"Según el cuadro del post-it, las penas de cinco a diez años prescriben a los diez años.",id:"q10cgk7u"},{q:"¿Cuándo prescribe una pena de quince años o más?",opts:["A los veinte años","A los quince años","A los diez años","A los cinco años"],correct:0,n:98,e:"Las penas de quince años o más prescriben a los veinte años.",id:"q1hpjp9y"},{q:"¿Cuál es el plazo general para interponer un recurso de inconstitucionalidad desde la publicación de una ley?",opts:["Tres meses","Nueve meses","Un mes","Quince días"],correct:0,n:99,e:"Con carácter general, el recurso de inconstitucionalidad se interpone en el plazo de tres meses desde la publicación de la ley.",id:"q11brx7g"},{q:"¿Qué plazo especial puede aplicarse al Gobierno y a los órganos colegiados y ejecutivos de las CCAA para recurrir una ley?",opts:["Nueve meses","Seis meses","Tres meses","Un año"],correct:0,n:99,e:"En el supuesto especial indicado, el plazo se amplía a nueve meses.",id:"qe4cnf5"},{q:"¿Qué tipo de hacker actúa de forma maliciosa, delictiva y normalmente con ánimo de lucro?",opts:["Black hat","White hat","Blue hat","Green hat"],correct:0,n:100,e:"El black hat es el ciberdelincuente que actúa de forma maliciosa y con ánimo de lucro.",id:"q1wu2u5i"},{q:"¿Qué tipo de hacker prueba infraestructuras para detectar fallos y mejorarlas?",opts:["White hat","Black hat","Red hat","Grey hat"],correct:0,n:100,e:"El white hat realiza pruebas de seguridad con la finalidad de mejorar las infraestructuras.",id:"qodg6gj"},{q:"¿Qué tipo de hacker se sitúa entre el black hat y el white hat y puede solicitar pagos?",opts:["Grey hat","Purple hat","Blue hat","Red hat"],correct:0,n:100,e:"El grey hat se mueve entre intenciones buenas y malas y puede solicitar pagos.",id:"q1qsro7d"},{q:"¿Qué tipo de hacker pretende destruir o neutralizar lo que realizan los black hats?",opts:["Red hat","Green hat","White hat","Grey hat"],correct:0,n:100,e:"El red hat busca combatir y destruir la actividad de los black hats.",id:"qak9sn9"},{q:"¿Qué tipo de hacker es contratado para buscar errores y mejorarlos?",opts:["Blue hat","Black hat","Purple hat","Red hat"],correct:0,n:100,e:"El blue hat es contratado para localizar errores y contribuir a corregirlos.",id:"q19e6itl"},{q:"¿Cómo se denomina al hacker novato, pero con altos conocimientos, según el post-it?",opts:["Green hat","White hat","Grey hat","Blue hat"],correct:0,n:100,e:"El post-it identifica al green hat como novato con altos conocimientos.",id:"qv5cmfx"},{q:"¿Qué tipo de hacker domina tanto el hacking ofensivo como el defensivo?",opts:["Purple hat","Red hat","Blue hat","Black hat"],correct:0,n:100,e:"El purple hat es experto en hacking ofensivo y defensivo.",id:"q1lhxjo4"},{q:"¿Cómo se califican siempre las penas impuestas a personas jurídicas?",opts:["Como graves","Como menos graves","Como leves","Según la cuantía de la multa"],correct:0,n:101,e:"Según el post-it, las penas aplicables a personas jurídicas son siempre graves.",id:"q6kilr0"},{q:"¿Cómo se activa la protección temporal descrita en el post-it?",opts:["Para colectivos específicos, no individualmente","Solo para solicitudes individuales","Únicamente para menores de edad","Exclusivamente por resolución judicial"],correct:0,n:102,e:"La protección temporal se activa para colectivos específicos, no para personas individualmente consideradas.",id:"q1qxdtn7"},{q:"¿Cuál es la duración inicial máxima de la protección temporal?",opts:["Un año","Seis meses","Dos años","Tres años"],correct:0,n:102,e:"Su duración inicial máxima es de un año; después puede prorrogarse por períodos de seis meses.",id:"q1c8vbv4"},{q:"¿Hasta qué máximo adicional puede prorrogarse la protección temporal tras su duración inicial?",opts:["Dos años adicionales","Seis meses adicionales","Un año adicional","Tres años adicionales"],correct:0,n:102,e:"Puede prorrogarse cada seis meses hasta alcanzar, como máximo, dos años adicionales.",id:"q1sauhwa"},{q:"¿Con qué solicitud es compatible la protección temporal?",opts:["Con una solicitud individual de protección internacional tramitada simultáneamente","Con ninguna solicitud individual","Solo con una solicitud de nacionalidad","Solo con un recurso de amparo"],correct:0,n:102,e:"La protección temporal es compatible con la tramitación simultánea de una solicitud individual de protección internacional.",id:"q9a3bt1"},{q:"¿A qué generación de Karel Vasak pertenecen los derechos civiles y políticos?",opts:["A la primera generación, vinculada a la libertad","A la segunda generación, vinculada a la igualdad","A la tercera generación, vinculada a la solidaridad","A la cuarta generación, vinculada a la tecnología"],correct:0,n:103,e:"La primera generación reúne derechos civiles y políticos, concebidos como protección frente a injerencias del Estado.",id:"qfpriau"},{q:"¿Qué derechos caracterizan principalmente a la segunda generación de Karel Vasak?",opts:["Los económicos, sociales y culturales","Los civiles y políticos","Los vinculados al medio ambiente y la paz","Los digitales y bioéticos"],correct:0,n:103,e:"La segunda generación se asocia a la igualdad y requiere una intervención activa del Estado en trabajo, educación, salud o Seguridad Social.",id:"q1ux5dub"},{q:"¿Con qué idea se asocia la tercera generación de derechos?",opts:["Con la solidaridad y la fraternidad","Con la libertad individual","Con la igualdad formal ante la ley","Con la tecnología y la bioética"],correct:0,n:103,e:"La tercera generación se centra en justicia, paz, cooperación internacional, medio ambiente, desarrollo y derechos de los pueblos.",id:"qydgj9"},{q:"¿Qué ámbito se vincula a la cuarta generación de derechos?",opts:["La diversidad y la tecnología","El derecho de voto","La libertad de expresión","La negociación colectiva"],correct:0,n:103,e:"La cuarta generación se relaciona con los avances tecnológicos y la globalización, como la protección de datos, el entorno digital y la bioética.",id:"qnfp67v"},{q:"¿Qué conducta se califica como infracción leve en materia de DNI e identificación según el post-it?",opts:["No denunciar la pérdida o sustracción del documento","Negarse a identificarse ante los agentes","Dar datos falsos al identificarse","Mentir para obtener el documento"],correct:0,n:104,e:"Son leves las conductas de descuido o pasividad, como no denunciar una pérdida o robo, o no entregar el documento tras acordarse su retirada.",id:"q1tz4xs5"},{q:"¿Cuál de estas conductas se califica como infracción grave en materia de DNI e identificación?",opts:["Dar datos falsos al identificarse","Perder el DNI por primera vez","No llevar una fotocopia del DNI","Renovar el DNI fuera de la localidad de residencia"],correct:0,n:104,e:"Son graves las conductas de oposición o engaño: negarse a identificar, facilitar datos falsos o mentir para obtener el documento.",id:"q1nkcdco"},{q:"¿Qué tipo de pirámide de población también se denomina pagoda o clásica?",opts:["La expansiva o progresiva","La estacionaria o estable","La regresiva o envejecida","La pirámide de urna"],correct:0,n:105,e:"La pirámide expansiva recibe también los nombres de progresiva, pagoda y clásica.",id:"qeudubc"},{q:"¿Qué tipo de pirámide de población se conoce también como campana?",opts:["La estacionaria, estancada o estable","La expansiva o progresiva","La regresiva o envejecida","La de pagoda"],correct:0,n:105,e:"La pirámide estacionaria también se denomina estancada, estable o de campana.",id:"q1faonug"},{q:"¿Qué tipo de pirámide de población se conoce también como bulbo, hucha o urna?",opts:["La regresiva o envejecida","La expansiva o progresiva","La estacionaria o estable","La de pagoda"],correct:0,n:105,e:"La pirámide regresiva recibe asimismo los nombres de envejecida, bulbo, hucha y urna.",id:"qod5jf9"},{q:"¿Cuál es el plazo general para declarar un nacimiento?",opts:["72 horas","10 días","30 días","Una semana"],correct:0,n:72,e:"Como regla general, la declaración de nacimiento debe realizarse en 72 horas; existen los supuestos especiales de parto fuera de hospital y causa justificada.",id:"q142uy5d"},{q:"¿Cuándo se adquiere la capacidad jurídica?",opts:["Desde el nacimiento","Al cumplir 18 años","Al inscribirse en el Registro Civil","Al emanciparse"],correct:0,n:72,e:"La capacidad jurídica se adquiere desde el nacimiento. La capacidad de obrar plena se adquiere, con carácter general, a los 18 años.",id:"quwe6zv"},{q:"¿Qué domicilio se caracteriza por ser distinto del domicilio real?",opts:["El domicilio efectivo","El domicilio legal o necesario","El domicilio familiar","El domicilio habitual"],correct:0,n:72,e:"El domicilio real es el habitual; el efectivo es distinto del real. El legal o necesario es, por ejemplo, el familiar de un hijo que vive con sus padres.",id:"q1q6v5wn"},{q:"Tras dejar de pertenecer a las Fuerzas y Cuerpos de Seguridad, ¿durante cuánto tiempo no se pueden ejercer funciones de dirección o administración en armacodinámica","La farmacocinética","La sociológica","La jurídica"],correct:0,n:76,e:"El post-it vincula el concepto biológico con la farmacodinámica.",id:"q6apyy7"},{q:"¿Qué es el personal de seguridad privada?",opts:["La persona física que desarrolla funciones de seguridad privada","Cualquier empresa autorizada de seguridad","Todo funcionario de las Fuerzas y Cuerpos de Seguridad","El conjunto de medios técnicos instalados"],correct:0,n:76,e:"El personal de seguridad privada es una persona física que desarrolla funciones de seguridad privada.",id:"q1ecmk4n"},{q:"¿Quién integra el personal acreditado en seguridad privada según el post-it?",opts:["Profesionales, ingenieros y técnicos","Solo vigilantes de seguridad","Exclusivamente detectives privados","Únicamente directores de seguridad"],correct:0,n:76,e:"El personal acreditado se refiere a profesionales, ingenieros y técnicos.",id:"q1iae6z6"},{q:"¿Qué tecnología de memoria RAM apilada en 3D se caracteriza por disponer de mucho ancho de banda?",opts:["HBM","DDR3","SRAM","ROM"],correct:0,n:77,e:"HBM es memoria RAM apilada en 3D y de alto ancho de banda.",id:"qd1dzjb"},{q:"¿Qué efecto consiste en atribuir una valoración positiva general por un rasgo favorable?",opts:["Efecto halo","Efecto diablo","Efecto Pigmalión","Efecto Golem"],correct:0,n:77,e:"El efecto halo es el aura positiva que condiciona la valoración global de una persona.",id:"qqottl6"},{q:"¿Qué efecto consiste en atribuir una valoración negativa general por un rasgo desfavorable?",opts:["Efecto diablo","Efecto halo","Efecto Pigmalión","Efecto placebo"],correct:0,n:77,e:"El efecto diablo es el aura negativa que condiciona la valoración global.",id:"q5172hy"},{q:"En el régimen disciplinario de la Policía, no usar uniforme cuando sea preceptivo constituye una falta:",opts:["Grave","Muy grave","Leve","No sancionable"],correct:0,n:77,e:"La falta de aseo es leve; beber o consumir drogas durante el servicio es muy grave; no usar uniforme cuando es obligatorio ica privada autorizada para prestar servicios de seguridad","Cualquier administración pública que vigila edificios","Una asociación profesional sin autorización","Un conjunto de medios técnicos de vigilancia"],correct:0,n:87,e:"La empresa de seguridad puede ser persona física o jurídica privada, pero debe estar autorizada para prestar servicios.",id:"qgwosgz"},{q:"¿Qué requisito caracteriza al personal de seguridad privada?",opts:["Haber obtenido la correspondiente habilitación","Ser siempre funcionario público","Pertenecer a una empresa estatal","Tener un título universitario de ingeniería"],correct:0,n:87,e:"El personal de seguridad privada es persona física que desarrolla funciones de seguridad privada y ha obtenido la habilitación correspondiente.",id:"q1wsc67t"},{q:"¿Qué emparejamiento de conceptos de seguridad privada es correcto?",opts:["Funciones–facultades","Actividades–disposiciones","Servicios–ámbitos","Medidas–acciones"],correct:0,n:87,e:"Las actividades son ámbitos; los servicios, acciones; las funciones, facultades; y las medidas, disposiciones.",id:"q1q807iz"},{q:"¿Qué se entiende por accidente de trabajo según el post-it?",opts:["Toda lesión corporal sufrida con ocasión del trabajo","Cualquier daño material sin lesión","Toda enfermedad contraída fuera del trabajo","Solo un accidente ocurrido en el trayecto al trabajo"],correct:0,n:87,e:"El accidente de trabajo es toda lesión corporal que se sufra con ocasión del trabajo.",id:"q1wdjlzv"},{q:"¿Qué requisito debe cumplir una enfermedad para ser considerada profesional?",opts:["Estar recogida en el cuadro correspondiente y ser contraída por cuenta propia o ajena","Producir una baja superior a 30 días","Afectar solo a trabajadores por cuenta ajena","Haber sido declarada por un juez"],correct:0,n:87,e:"La enfermedad profesional debe contraerse a causa del trabajo por cuenta propia o ajena y figurar en el cuadro correspondiente.",id:"qt0qjy7"},{q:"¿Qué grado de incapacidad permanente supone una disminución
