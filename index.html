    <script id="elcorcho-bootstrap">window.__EL_CORCHO_BOOTSTRAP__={"notes":[{"body":"\n\u003cb\u003e1.\u003c/b\u003e Arma corta\u003cbr\u003e\n\u003cb\u003e2.1\u003c/b\u003e Armas de fuego largas — para vigilancia y guardería\u003cbr\u003e\n\u003cb\u003e2.2\u003c/b\u003e Armas de fuego largas rayadas\u003cbr\u003e\n\u003cb\u003e3.1\u003c/b\u003e Armas de fuego largas rayadas para tiro deportivo (calibre 5'6mm, percusión anular)\u003cbr\u003e\n\u003cb\u003e3.2\u003c/b\u003e Escopetas y demás armas de ánima lisa o agujereadas con cañón con rayas (plomeo)\u003cbr\u003e\n\u003cb\u003e3.3\u003c/b\u003e Armas accionadas por aire o gas comprimido (no exceda 24,2 julios)\u003cbr\u003e\n\u003cb\u003e4.1\u003c/b\u003e Carabinas y pistolas (accionadas x gas) — lúdico-deportivas airsoft y paintball (tarjeta A) \u003ci\u003e[doble acción]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003e4.2\u003c/b\u003e Carabinas y pistolas de ánima lisa (gas) airsoft/paintball x muelle o resorte \u003ci\u003e[acción simple]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003e5.1\u003c/b\u003e Armas blancas (no prohibidas)\u003cbr\u003e\n\u003cb\u003e5.2\u003c/b\u003e Cuchillos y machetes (militares)\u003cbr\u003e\n\u003cb\u003e6.1\u003c/b\u003e Antiguas / históricas\u003cbr\u003e\n\u003cb\u003e6.2\u003c/b\u003e Armas de fuego anteriores a 1/1/1890\u003cbr\u003e\n\u003cb\u003e6.3\u003c/b\u003e Restantes armas históricas/artísticas\u003cbr\u003e\n\u003cb\u003e6.4\u003c/b\u003e Avancarga\u003cbr\u003e\n\u003cb\u003e7.1\u003c/b\u003e Armas de inyección anestésica \u0026nbsp; \u003cb\u003e7.2\u003c/b\u003e Ballestas \u0026nbsp; \u003cb\u003e7.3\u003c/b\u003e Lanzacabos\u003cbr\u003e\n\u003cb\u003e7.4\u003c/b\u003e Flobert \u0026nbsp; \u003cb\u003e7.5\u003c/b\u003e Arcos, pesca, fusiles de pesca \u0026nbsp; \u003cb\u003e7.6\u003c/b\u003e Arma de alarma y señales\u003cbr\u003e\n\u003cb\u003e8.1\u003c/b\u003e Arma acústica y de salvas\u003cbr\u003e\n\u003cb\u003e9.1\u003c/b\u003e Armas inutilizadas","cat":"K","id":"1","nota":1,"titulo":"Clasificación legal de armas"},{"body":"-Bien jurídico protegido: el valor abstracto que tutela la norma (la vida, el patrimonio...).\u003cbr\u003e-Sujeto pasivo: es el titular del bien jurídico protegido, es decir, la persona (física o jurídica) a quien pertenece ese derecho o interés. Siempre es una persona.\u003cbr\u003e-Objeto material: es la cosa o persona física sobre la que recae la conducta. Puede ser una persona o una cosa.","id":"nota-1790019344385","nota":1,"titulo":"BJP, sujeto pasivo y objeto material"},{"body":"\n\u003cb\u003eParís (1951/1952)\u003c/b\u003e — CECA — 6 países. Plan Schuman. \u003ci\u003e[Fundacional]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003eRoma (1957/1958)\u003c/b\u003e — CEE, Euratom, Mercado Común, BEI, FSE, Unión Aduanera. \u003ci\u003e[Fundacional]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003eBruselas/Fusión (1965-1967)\u003c/b\u003e — CECA+Euratom+CEE, Comisión, Consejo. \u003ci\u003e[Complementario]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003eActa Única (1986/1987)\u003c/b\u003e — Mayoría cualificada, P.E. oficial, España y Portugal. \u003ci\u003e[Modificativo]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003eMaastricht (1992/1993)\u003c/b\u003e — Nace la UE, 3 pilares, ciudadanía UE, BCE, Europol. \u003ci\u003e[Fundacional]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003eÁmsterdam (1997/1999)\u003c/b\u003e — Schengen, PESC. \u003ci\u003e[Modificativo]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003eNiza (2001/2003)\u003c/b\u003e — De 15 a 25 miembros, Comité de Protección Social. \u003ci\u003e[Modificativo]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003eLisboa (2007/2009)\u003c/b\u003e — Personalidad jurídica única, inicia ciudadanía, presidencia del Consejo. \u003ci\u003e[Modificativo]\u003c/i\u003e","cat":"H","id":"2","nota":2,"titulo":"Tratados de la Unión Europea (Tema 4)"},{"body":"\n\u003cb\u003eCorrespondencia:\u003c/b\u003e Inicial 3 meses · Prórroga 18 meses · Urgencia 72h\u003cbr\u003e\n\u003cb\u003eInterceptación telefónica: 003e46\u003c/b\u003e\u003cbr\u003e\nTribunal Europeo de Derechos Humanos (TEDH) — \u003cb\u003e46\u003c/b\u003e\u003cbr\u003e\nComité Europeo para la Prevención de la Tortura (CPT) — \u003cb\u003e46\u003c/b\u003e\u003cbr\u003e\nConsejo de Derechos Humanos (ONU) — \u003cb\u003e47\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n\u003cb\u003eRegla:\u003c/b\u003e si es de la UE/Europa → 46 · si es internacional (ONU) → 47","cat":"I","id":"38b","nota":38,"titulo":"Consejo de Europa, TEDH, CPT y Consejo DDHH (46 vs 47)"},{"body":"\n\u003cb\u003eMayoría simple\u003c/b\u003e → leyes ordinarias, trámite sencillo\u003cbr\u003e\n\u003cb\u003eMayoría absoluta\u003c/b\u003e → leyes orgánicas, veto, moción de censura (caída del gobierno)\u003cbr\u003e\n\u003cb\u003eMayoría 3/5\u003c/b\u003e → elección de jueces (vocales CGPJ, magistrados TC) o reforma de artículos \"normales\" de la Constitución\u003cbr\u003e\n\u003cb\u003eMayoría 2/3\u003c/b\u003e → cuestiones relativas a la Corona o reforma agravada de la Constitución","cat":"A","id":"39","nota":39,"titulo":"Tipos de mayoría parlamentaria"},{"body":"\n\u003cb\u003eSesión conjunta:\u003c/b\u003e Corona / cuestiones no legislativas del Título II\u003cbr\u003e\n\u003cb\u003eSolo Congreso:\u003c/b\u003e control político del Gobierno\u003cbr\u003e\n\u003cb\u003ePrimero Senado, después Congreso:\u003c/b\u003e asuntos territoriales (CCAA) — comisiones mixtas si hay desacuerdo\u003cbr\u003e\n\u003cb\u003ePrimero Congreso, después Senado:\u003c/b\u003e elaboración de leyes comunes → Senado: 2 meses para enmendar/vetar → Congreso tiene la última palabra\u003cbr\u003e\n\u003cb\u003eVotación simultánea:\u003c/b\u003e reforma de la CE → 2/3 · elección de jueces → 3/5","cat":"A","id":"40","nota":40,"titulo":"Sistemas de votación en las Cortes"},{"body":"\n\u003cb\u003ePrincipios rectores:\u003c/b\u003e especialidad, idoneidad, excepcionalidad, necesidad, proporcionalidad\u003cbr\u003e\u003cbr\u003e\n\u003cb\u003eMedidas:\u003c/b\u003e\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003e1. Interceptación de comunicaciones telefónicas — hasta 3M, prorrogable hasta 18M\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e2. Captación de comunicaciones orales\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e3. Apertura de correspondencia, telegrafía — hasta 3M, prorrogables hasta 18M\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e4. Dispositivos técnicos de seguimiento y localización — hasta 3M, prorrogables hasta 18M\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e5. Registro y almacenamiento masivo de datos\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e6. Registro remoto de equipos informáticos — máx. 1M, prorrogable hasta 3M\u003c/span\u003e","cat":"F","id":"41","nota":41,"titulo":"Principios y medidas de investigación tecnológica"},{"body":"\u003cb\u003ePNPIC\u003c/b\u003e — Elabora: MIR a través SES · Aprueba: SES · Registra/Actualiza: CNPIC · Revisa: SES\u003cbr\u003e\n\u003cb\u003ePES\u003c/b\u003e — Elabora: Grupo de Trabajo · Aprueba: la Comisión (12M) · Registra: CNPIC · Revisa/Actualiza: cada 2 años, Ministerios y Organismos\u003cbr\u003e\n\u003cb\u003ePSO\u003c/b\u003e (documentos estratégicos) — Elabora: O.P. (6M) · Registro: CNPIC · Aprueba: SES · Revisa: OC — Aprueba: CNPIC (2 años) · Actualiza: O.C.\u003cbr\u003e\n\u003cb\u003ePPE\u003c/b\u003e (doc. operativo, medidas ya tomadas) — Elabora: Operador Critico(4M) · Aprueba: SES · Registra: Del. Gob. · Revisa/Actualiza: OC, aprobado por el Delegado del Gobierno\u003cbr\u003e\n\u003cb\u003ePAO\u003c/b\u003e (doc. operativo, medidas a tomar por AAPP) — Elabora: Policía · Aprueba: SES · Registra: Del. Gob. · Revisa/Actualiza: Policía","cat":"G","id":"42","nota":42,"titulo":"PNPIC, PES, PSO, PPE y PAO"},{"body":"\nNo se puede ser Diputado y Senador simultáneamente\u003cbr\u003e\nSe prohíbe acumular acta de Asamblea de CCAA con la de Diputado — para Senadores: sí es posible\u003cbr\u003e\nEl Presidente de una CCAA no puede ser Diputado (es miembro de la Asamblea)\u003cbr\u003e\u003cbr\u003e\n\u003cb\u003eDefensor del Pueblo:\u003c/b\u003e elegido por las Cortes Generales a propuesta de la Comisión Mixta Congreso-Senado\u003cbr\u003e\u003cbr\u003e\nLa disolución de las Cámaras la decreta el \u003cb\u003eRey\u003c/b\u003e","cat":"A","id":"43a","nota":43,"titulo":"Incompatibilidades, disolución y Defensor del Pueblo"},{"body":"\nLas cuestiones \u003cb\u003eprejudiciales\u003c/b\u003e planteadas por tribunales nacionales las resuelve el \u003cb\u003eTribunal de Justicia\u003c/b\u003e\u003cbr\u003e\nEl \u003cb\u003eTribunal General\u003c/b\u003e resuelve cuestiones entre particulares","cat":"H","id":"43b","nota":43,"titulo":"Tribunal de Justicia vs Tribunal General (UE)"},{"body":"Mayoría cualificada en el Consejo de la UE → \u003cb\u003e55% – 65%\u003c/b\u003e","cat":"H","id":"44a","nota":44,"titulo":"Mayoría cualificada en el Consejo de la UE"},{"body":"\n\u003cb\u003eNotificaciones Interpol:\u003c/b\u003e\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003e\u003cb\u003eNaranja\u003c/b\u003e — acontecimiento, persona u objeto que suponga grave peligro inminente para la Seguridad Pública\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e\u003cb\u003eMorada\u003c/b\u003e — Modus operandi\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e\u003cb\u003eAzul\u003c/b\u003e — conseguir más información de una persona\u003c/span\u003e\u003cbr\u003e\nDelegado del Gobierno — rango de Subsecretario\u003cbr\u003e\nSubdelegado del Gobierno — rango de Subdirector General\u003cbr\u003e\u003cbr\u003e\n\u003cb\u003eDirección General de Relaciones Internacionales:\u003c/b\u003e\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003eSG Cooperación Internacional Policial\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003eSG Relaciones Internacionales, Inmigración y Extranjería\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003eSG Asuntos Europeos\u003c/span\u003e\u003cbr\u003e\nOficina del Policía — S. General — Div. Personal","cat":"G","id":"44b","nota":44,"titulo":"Interpol, Delegado del Gobierno y Relaciones Internacionales"},{"body":"\n\u003cb\u003eB.I.T.\u003c/b\u003e (Brigada Central Investigación Tecnológica) — delitos contra las personas cometidos mediante nuevas tecnologías\u003cbr\u003e\n\u003cb\u003eBC Fraude Informático\u003c/b\u003e — fraudes\u003cbr\u003e\n\u003cb\u003eBSI\u003c/b\u003e (BC. Seguridad Informática) — delitos de alta especialización, Fraude BEC\u003cbr\u003e\nOficina de Marca — PN — C. Técnico\u003cbr\u003e\u003cbr\u003e\nRégimen del Personal DGP: se accede por Concurso-Oposición o Antigüedad (ascenso interno)","cat":"G","id":"45a","nota":45,"titulo":"Brigadas técnicas, Oficina de Marca y acceso a la DGP"},{"body":"\n\u003cb\u003eResidencia general (\u0026lt;5 años):\u003c/b\u003e orden público, seguridad, salud pública\u003cbr\u003e\n\u003cb\u003eResidencia permanente (5-10 años):\u003c/b\u003e razones graves de seguridad pública\u003cbr\u003e\n\u003cb\u003eResidencia de larga duración (+10 años):\u003c/b\u003e razones imperiosas de seguridad pública","cat":"E","id":"45b","nota":45,"titulo":"Clasificación de la residencia por tiempo"},{"body":"\n\u003cb\u003eSenadores en las islas:\u003c/b\u003e islas mayores 3 senadores · islas menores 1 senador\u003cbr\u003e\nOficina presupuestaria — depende directamente del Titular de la Subsecretaría del Interior\u003cbr\u003e\n\u003cb\u003eReferéndum:\u003c/b\u003e convocado por el Rey, propuesto por el Presidente del Gobierno, autorizado por las Cortes Generales\u003cbr\u003e\u003cbr\u003e\nRegla práctica: si el enunciado dice \"sanciones\", es sanción","cat":"A","id":"46a","nota":46,"titulo":"Senadores insulares, oficina presupuestaria y referéndum"},{"body":"\nSolicitud de apatridia: 1 mes desde la entrada\u003cbr\u003e\nRenovación de residencia temporal no lucrativa: 2 años, salvo RDL","cat":"E","id":"46b","nota":46,"titulo":"Apatridia y renovación de residencia temporal no lucrativa"},{"body":"\nCoordinación CCP y CCPA — DGCYE\u003cbr\u003e\nPortugal: 5 (CCPA) · Francia: 4 (CCPA)\u003cbr\u003e\nUIP — Seguridad Ciudadana","cat":"G","id":"46c","nota":46,"titulo":"Coordinación internacional: CCP/CCPA y UIP"},{"body":"\n\u003cb\u003eLey Orgánica:\u003c/b\u003e derechos fundamentales y libertades públicas — mayoría absoluta del Congreso\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003eSi afecta a las CCAA → también mayoría absoluta del Senado\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003eDentro de la LO: Ley de Transferencia (el Estado da facultades a las CCAA)\u003c/span\u003e\n\u003cb\u003eLey Ordinaria:\u003c/b\u003e Leyes marco, Leyes de armonización\u003cbr\u003e\n\u003cb\u003eDecreto-Ley:\u003c/b\u003e extraordinaria y urgente necesidad\u003cbr\u003e\n\u003cb\u003eDecreto Legislativo:\u003c/b\u003e las Cortes Generales delegan en el Gobierno\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003eLey de Bases → Texto Articulado\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003eLey Ordinaria → Texto Refundido\u003c/span\u003e","cat":"A","id":"47","nota":47,"titulo":"Jerarquía normativa española"},{"body":"\nGabinete MIR — Director General\u003cbr\u003e\nGabinete SES — Subdirector General\u003cbr\u003e\u003cbr\u003e\nAuditorías PN → cada 5 años\u003cbr\u003e\n\"Revisiones de evaluación inicial\" (PN) → cada 4 años · general → cada 4 años","cat":"G","id":"48a","nota":48,"titulo":"Gabinetes MIR/SES y periodicidad de auditorías"},{"body":"\nTeoría de los rumores — Allport y Postman\u003cbr\u003e\u003cbr\u003e\n\u003cb\u003eAsimilación\u003c/b\u003e — el inmigrante pierde su identidad al incorporarse a la sociedad\u003cbr\u003e\n\u003cb\u003eAculturación\u003c/b\u003e — igual que la asimilación, pero NO se pierde la identidad; se integran elementos\u003cbr\u003e\n\u003cb\u003eTransculturación\u003c/b\u003e — la cultura superior absorbe a la inferior","cat":"J","id":"48b","nota":48,"titulo":"Rumores y aculturación"},{"body":"La SGT coordina las relaciones del Ministerio del Interior con el Defensor del Pueblo.","cat":"G","id":"49","nota":49,"titulo":"SGT y el Defensor del Pueblo"},{"body":"\nPublicación en el BOE de una ley, sin fecha: \u003cb\u003e20 días\u003c/b\u003e\u003cbr\u003e\nSanción de la ley para su publicación en el BOE por el Rey: \u003cb\u003e15 días\u003c/b\u003e\u003cbr\u003e\nPeriodo de pago voluntario: \u003cb\u003e20 días\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n\u003cb\u003eAlarma:\u003c/b\u003e declara el Gobierno mediante Decreto del Consejo de Ministros \u003ci\u003e[mnemotecnia: GC]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003eExcepción:\u003c/b\u003e declara el Gobierno mediante RD del Consejo de Ministros, con autorización del Congreso \u003ci\u003e[mnemotecnia: GC]\u003c/i\u003e\u003cbr\u003e\n\u003cb\u003eSitio:\u003c/b\u003e declara el Congreso a propuesta exclusiva del Gobierno \u003ci\u003e[mnemotecnia: CG]\u003c/i\u003e","cat":"A","id":"50a","nota":50,"titulo":"Plazos del BOE y estados de alarma/excepción/sitio"},{"body":"\n\u003cb\u003eProcedimiento ordinario:\u003c/b\u003e +9 años — Instrucción: Sumario\u003cbr\u003e\n\u003cb\u003eProcedimiento abreviado:\u003c/b\u003e hasta 9 años — Instrucción: Diligencias previas\u003cbr\u003e\n\u003cb\u003eProcedimiento de enjuiciamiento rápido:\u003c/b\u003e hasta 5 años — Instrucción: Diligencias urgentes\u003cbr\u003e\n\u003cb\u003eDelitos leves:\u003c/b\u003e instruye y enjuicia","cat":"B","id":"50b","nota":50,"titulo":"Procedimientos penales y delitos leves"},{"body":"\n\u003cb\u003eTribunal Supremo (5 salas):\u003c/b\u003e Civil, Penal, Contencioso-Administrativo, Social, Militar\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003eMnemotecnia C-P-C-S-M → \u003cb\u003eCIPECOSOMI\u003c/b\u003e\u003c/span\u003e\u003cbr\u003e\n\u003cb\u003eAudiencia Nacional (4 salas):\u003c/b\u003e Apelación, Penal (no civil), Contencioso-Administrativo, Social\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003eMnemotecnia A-P-C-S → \u003cb\u003eAPECOSO\u003c/b\u003e\u003c/span\u003e\u003cbr\u003e\n\u003cb\u003eTribunal Superior de Justicia (3 salas):\u003c/b\u003e Civil y Penal (Sala Común), Contencioso-Administrativo, Social\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003eMnemotecnia → \u003cb\u003eCICOSO\u003c/b\u003e\u003c/span\u003e","cat":"B","id":"51","nota":51,"titulo":"Salas de los tribunales: mnemotecnias"},{"body":"\n\u003cb\u003eReglamento:\u003c/b\u003e alcance general, obligatorio y directamente aplicable\u003cbr\u003e\n\u003cb\u003eDirectiva:\u003c/b\u003e obliga al destinatario en cuanto al objetivo a conseguir, no en la forma ni los medios\u003cbr\u003e\n\u003cb\u003eDecisión:\u003c/b\u003e obligatoria en todos sus elementos\u003cbr\u003e\nRecomendaciones y dictámenes: no vinculantes","cat":"H","id":"52a","nota":52,"titulo":"Fuentes del derecho de la UE"},{"body":"\nAños de validez del carnet/licencia tipo D: \u003cb\u003e5 años\u003c/b\u003e\u003cbr\u003e\nEspacios donde están presos y funcionarios M1/M2 → \u003cb\u003ecompartimentos\u003c/b\u003e","cat":"D","id":"52b","nota":52,"titulo":"Validez de licencias y compartimentos penitenciarios"},{"body":"\n\u003cb\u003ePresidente en funciones NO puede:\u003c/b\u003e\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003e\u003cb\u003eD\u003c/b\u003e — Disolver las Cortes Generales\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e\u003cb\u003eC\u003c/b\u003e — Plantear cuestión de confianza\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e\u003cb\u003eR\u003c/b\u003e — Convocar referéndum consultivo\u003c/span\u003e\u003cbr\u003e\n\u003cb\u003eGobierno en funciones NO puede:\u003c/b\u003e\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003e\u003cb\u003eP\u003c/b\u003e — Presupuestos Generales del Estado (PGE)\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e\u003cb\u003eP\u003c/b\u003e — Presentar proyectos de ley a las Cortes\u003c/span\u003e","cat":"A","id":"53a","nota":53,"titulo":"Presidente y Gobierno en funciones: DCR y P/P"},{"body":"En protección de datos, ante un menor fallecido se podrá actuar de oficio o a instancia de parte interesada.","cat":"F","id":"53b","nota":53,"titulo":"Protección de datos de menores fallecidos"},{"body":"\nExcedencia por cuidado de familiares en el CNP → reserva del puesto: 2 años / destino: 3 años\u003cbr\u003e\u003cbr\u003e\nFactor esencial, base, no explícito → \u003cb\u003eFactor Humano\u003c/b\u003e","cat":"G","id":"53c","nota":53,"titulo":"Excedencia por cuidado de familiares y factor humano"},{"body":"\nInformación procedente de imágenes e información geográfica → \u003cb\u003eIMINT\u003c/b\u003e\u003cbr\u003e\nProcede de fuentes técnicas → \u003cb\u003eSIGINT\u003c/b\u003e\u003cbr\u003e\nProcede de fuentes humanas → \u003cb\u003eHUMINT\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n\u003cb\u003eRegistros corporales — principios:\u003c/b\u003e proporcionalidad, igualdad de trato, no discriminación, injerencia mínima\u003cbr\u003e\nSi el registro corporal es coactivo (por la fuerza): proporcionalidad, idoneidad, necesidad → mnemotecnia \u003cb\u003eP.I.N.\u003c/b\u003e\u003cbr\u003e\nSe informa de las razones y se deja constancia por escrito","cat":"B","id":"54a","nota":54,"titulo":"Fuentes de inteligencia y registros corporales"},{"body":"Oficina de Delitos de Odio → \u003cb\u003eDGCYE\u003c/b\u003e","cat":"G","id":"54b","nota":54,"titulo":"Oficina de Delitos de Odio"},{"body":"\nSupervisor Europeo de Protección de Datos: mandato de \u003cb\u003e5 años\u003c/b\u003e\u003cbr\u003e\u003cbr\u003e\n\u003cb\u003ePilares de Maastricht:\u003c/b\u003e\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003e1º Pilar — Comunidades Europeas\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e2º Pilar — PESC\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003e3º Pilar — JAI\u003c/span\u003e","cat":"H","id":"55a","nota":55,"titulo":"Supervisor Europeo de Protección de Datos y pilares de Maastricht"},{"body":"\nSubcomité de prevención de la tortura — periodo de sesiones: \u003cb\u003e3\u003c/b\u003e\u003cbr\u003e\nProtocolo del Convenio contra la Tortura → Preámbulo y 37 artículos\u003cbr\u003e\u003cbr\u003e\n2001 — Contracumbre de Génova → \u003cb\u003eG8\u003c/b\u003e","cat":"I","id":"55b","nota":55,"titulo":"Subcomité para la Prevención de la Tortura"},{"body":"Derecho Civil y Mercantil → \u003cb\u003eDerecho Privado\u003c/b\u003e","cat":"C","id":"55c","nota":55,"titulo":"Derecho privado"},{"body":"\n\u003cb\u003eWirth\u003c/b\u003e — cita \"Heterogéneos\"\u003cbr\u003e\n\u003cb\u003eRatzel\u003c/b\u003e — cita \"Grandes vías comerciales\"\u003cbr\u003e\n\u003cb\u003eSorre\u003c/b\u003e — cita \"Organización social\"","cat":"J","id":"55d","nota":55,"titulo":"Definiciones de ciudad"},{"body":"\nInformación estadística sobre la evolución de la criminalidad → \u003cb\u003eDGCYE\u003c/b\u003e\u003cbr\u003e\nDARPA — Departamento de Defensa de EEUU\u003cbr\u003e\u003cbr\u003e\nLa inducción al suicidio se pena \u003cb\u003emás\u003c/b\u003e que la cooperación necesaria al suicidio","cat":"L","id":"55e","nota":55,"titulo":"Datos sueltos: DGCYE, DARPA e inducción al suicidio"},{"body":"Detención preventiva (adultos) → estrictamente necesaria y máximo \u003cb\u003e72H\u003c/b\u003e","cat":"B","id":"56a","nota":56,"titulo":"Detención preventiva de adultos"},{"body":"\nEl empresario consulta las decisiones preventivas con los representantes de los trabajadores\u003cbr\u003e\n\u003cb\u003eRootkit\u003c/b\u003e — software malicioso de control total\u003cbr\u003e\n\u003cb\u003eMS-DOS\u003c/b\u003e — monotarea, monousuario","cat":"L","id":"56b","nota":56,"titulo":"Datos sueltos: prevención laboral, rootkit y MS-DOS"},{"body":"\nDirección de la Administración Militar → \u003cb\u003eGobierno\u003c/b\u003e\u003cbr\u003e\nProponer y ejecutar la política del Gobierno en materia de Seguridad Ciudadana → \u003cb\u003eMIR\u003c/b\u003e\u003cbr\u003e\nLa UE se establece formalmente en el Tratado de Maastricht","cat":"A","id":"56c","nota":56,"titulo":"Administración militar, seguridad ciudadana y origen de la UE"},{"body":"La riña tumultuaria no constituye actos preparatorios.","cat":"B","id":"57a","nota":57,"titulo":"Riña tumultuaria"},{"body":"\n\u003cb\u003eTradicional\u003c/b\u003e — hay jerarquía de razas\u003cbr\u003e\n\u003cb\u003eSimbólico\u003c/b\u003e — no son racistas, pero se oponen a políticas de igualdad racial\u003cbr\u003e\n\u003cb\u003eModerno\u003c/b\u003e — las minorías amenazan los valores de la mayoría\u003cbr\u003e\n\u003cb\u003eAversivo\u003c/b\u003e — cree honestamente en la igualdad, pero se siente incómodo\u003cbr\u003e\n\u003cb\u003eLatente\u003c/b\u003e — está ahí pero no se ve, \"se encuentra dormido\"\u003cbr\u003e\n\u003cb\u003eAmbivalente\u003c/b\u003e — sentimientos positivos y negativos a la vez\u003cbr\u003e\n\u003cb\u003eSutil\u003c/b\u003e — no ataca de frente, pero actúa defendiendo valores tradicionales","cat":"J","id":"57b","nota":57,"titulo":"Tipos de racismo"},{"body":"\nEn la PN, excedencia por cuidado de familiares:\u003cbr\u003e\n\u003cspan class=\"ind1\"\u003eReserva de puesto = salario (misma localidad)\u003c/span\u003e\n\u003cspan class=\"ind1\"\u003eAl menos 2 años\u003c/span\u003e","cat":"G","id":"57c","nota":57,"titulo":"Excedencia por cuidado de familiares en el CNP"},{"body":"\n1. Inteligencia\u003cbr\u003e2. Conocimiento\u003cbr\u003e3. Información\u003cbr\u003e4. Dato","cat":"J","id":"58","nota":58,"titulo":"Pirámide de Davenport y Prusak"},{"body":"\n\u003cb\u003eAlzada:\u003c/b\u003e se acude a un superior jerárquico → dirigido a actos que \u003cb\u003eNO\u003c/b\u003e ponen fin a la vía administrativa\u003cbr\u003e\n\u003cb\u003eReposición:\u003c/b\u003e es como pedir una revisión → dirigido a actos que \u003cb\u003eponen fin\u003c/b\u003e a la vía administrativa\u003cbr\u003e\n\u003cb\u003eRevisión:\u003c/b\u003e se solicita si hay nuevos documentos o errores → sentencias firmes o cerradas\u003cbr\u003e\n\u003cb\u003eReexamen:\u003c/b\u003e puestos fronterizos y CIE → 2 días (solicitud) / 2 días (resolución)","cat":"D","id":"59a","nota":59,"titulo":"Recursos administrativos"},{"body":"\n\u003cb\ Locales de mayor implantación a nivel nacional.\u003cbr\u003eg) La Comisión Nacional para la Protección de las Infraestructuras Críticas.\u003cbr\u003eh) El Grupo de Trabajo Interdepartamental para la Protección de las Infraestructuras Críticas.\u003cbr\u003ei) Los operadores críticos del sector público y privado.","cat":"A","id":"extra-1789720502656","nota":92,"titulo":"Agentes del Sistema IC"},{"body":"Redes trampa (Wifi falsas)\u003cbr\u003eSpoofing o suplantación\u003cbr\u003eIP Spoofing\u003cbr\u003eWeb Spoofing\u003cbr\u003eEmail Spoofing\u003cbr\u003eDNS Spoofing\u003cbr\u003eAtaques a Cookies\u003cbr\u003eAtaques DDoS\u003cbr\u003eInyección SQL\u003cbr\u003eEscaneo de puertos\u003cbr\u003eMan in the middle o ataque de intermediario\u003cbr\u003eSniffing","cat":"A","id":"extra-1789737494926","nota":93,"tags":["L"],"titulo":"Ataques a las conexiones"},{"body":"Responsables criminalmente del delito: Autores y Complice.\u003cbr\u003e¿Quienes son autores?Todos los demas exceptuando el complice.\u003cbr\u003e\u003cbr\u003eENCUBRIR es delito autonomo","cat":"A","id":"extra-1789737593902","nota":94,"titulo":"Tipos de criminales"},{"body":"Reforma Ordinaria (Art. 167 CE)   \u003cbr\u003eAplica a: Materias generales (no blindadas).   \u003cbr\u003e          Aprobación:Principal: 3/5 de cada Cámara.   \u003cbr\u003e          Mediación: Comisión Mixta (texto único).   \u003cbr\u003e          Desbloqueo: 2/3 del Congreso + Mayoría Absoluta del Senado.   Referéndum: Facultativo (1/10 de cualquier Cámara en 15 días). \u003cbr\u003e\u003cbr\u003eReforma Agravada (Art. 168 CE)   \u003cbr\u003e   Aplica a: Revisión total o materias blindadas (Título Preliminar, Derechos Fundamentales y La Corona).   \u003cbr\u003e   Fases:\u003cbr\u003e            Aprobación inicial por 2/3 de cada Cámara.   \u003cbr\u003e            Disolución de las Cortes y nuevas elecciones.   \u003cbr\u003e            Aprobación definitiva por 2/3 de las nuevas Cámaras. \u003cbr\u003e      Referéndum: Obligatorio.    \u003cbr\u003e\u003cbr\u003eLímite temporal (Art. 169 CE): Prohibido iniciar en tiempo de guerra o bajo estados de alarma, excepción o sitio.","cat":"A","id":"nota-1789741997024","nota":95,"titulo":"Reforma de la constitucion."},{"body":"La no conformidad de esto antes de iniciar el servicio no pasa nada, el resto de cosas que no sean esto hacen que no sea apto el servicio:\n\n    -Higiene y desinfección de los vehículos policiales.\n    -Comprobación de la existencia, funcionamiento y buen estado general de los complementos y herramientas del vehículo de dotación policial.\n\nSe ha de dejar constancia del estado del vehículo y de las incidencias en el correspondiente “Libro de Servicio de la Unidad”, así como el “Libro de Control de Vehículos y Material de Dotación” correspondiente a cada uno de los vehículos policiales, acto que ha de llevarse a cabo por los propios conductores de estos, tanto al inicio como en la finalización de la prestación del servicio.","cat":"A","id":"nota-1789743376397","nota":96,"titulo":"Higiene y complementos en el Coche del policia"},{"body":"Norma general: \u003cbr\u003eEl personal de seguridad privada uniformado, constituido por los vigilantes de seguridad y de explosivos y por los guardas rurales y sus especialidades, prestará sus servicios vistiendo el uniforme y ostentando el distintivo del cargo, y portando los medios de defensa reglamentarios, que no incluirán armas de fuego.\u003cbr\u003e\u003cbr\u003e Excepciones:\u003cbr\u003e     1)Valores y Objetos Valiosos:\u003cbr\u003e        Almacenamiento, recuento, clasificación y transporte de dinero, títulos-valores, joyas y objetos valiosos.\u003cbr\u003e     2)Armas y Explosivos:\u003cbr\u003e        Fábricas, depósitos y transporte de armas, cartuchería metálica y explosivos.\u003cbr\u003e     3)Buques en Aguas de Riesgo:\u003cbr\u003e        Buques mercantes y pesqueros de bandera española que naveguen en aguas de grave riesgo de piratería u otras amenazas.\u003cbr\u003e     4)Vigilancia Perimetral e Instalaciones Públicas:\u003cbr\u003e        Centros penitenciarios, Centros de Internamiento de Extranjeros (CIE), establecimientos militares e \u003cb\u003einfraestructuras críticas\u003c/b\u003e u otros edificios públicos.","cat":"A","id":"nota-1789746028167","nota":97,"titulo":"Vigilantes de seguridad con armas?"},{"body":"Pérdida de la nacionalidad de los españoles que no lo sean de origen según el Código Civil.  ----\u0026gt;Los españoles que no lo sean de origen perderán la nacionalidad cuando durante un período de TRES AÑOS utilicen exclusivamente la nacionalidad a la que hubieran declarado renunciar al adquirir la nacionalidad española. \u003cbr\u003e\u003cbr\u003e----------------------------------------------------------\u003cbr\u003eMandato de los consejeros del consejo de policia -\u0026gt; 4 AÑOS\u003cbr\u003e----------------------------------------------------------\u003cbr\u003ePena 5 a 10 años -\u0026gt;Preescribe 10 años\u003cbr\u003ePena de 10 a 15 años -\u0026gt; Prescribe a los 15 años\u003cbr\u003ePena de 15 años o mas -\u0026gt; Prescribe a los 20 años","cat":"A","id":"nota-1789746819168","nota":98,"titulo":"Varios"},{"body":"Plazo general desde la publicacion de una ley para interponer el recurso de inconstitucionalidad -\u0026gt;3 meses\u003cbr\u003e----------------------------------------------------------\u003cbr\u003ePlazo especial (gobierno y organos colegiados y ejecutivos de CCAA) desde la publicacion de una ley para interponer el recurso de inconstitucionalidad -\u0026gt; 9meses","cat":"A","id":"nota-1789747290667","nota":99,"titulo":"Plazos recurso de inconstitucionalidad"},{"body":"Black hat: ciberdelincuente, malicioso, animo de lucro.\u003cbr\u003eWhite hat: Prueban infraestructuras de internet paara mejorarlas.\u003cbr\u003eGrey hat: Se mueve entre el negro y el blanco.Buenas y malas intenciones. Solicita pagos.\u003cbr\u003eRed hat: Quieren destruir todo lo que hacen los black hats.\u003cbr\u003eBlue hat: Contratados en busca de errores y mejorarlos.\u003cbr\u003eGreen hat: Novatos con altos conocimientos.\u003cbr\u003ePurple hat: Experto en hacking ofensivo y defensivo.","cat":"A","id":"nota-1789979726904","nota":100,"titulo":"Sombreros (informatica)"},{"body":"Las penas a personas juridicas SIEMPRE son graves.","cat":"A","id":"nota-1789979996770","nota":101,"titulo":"Penas personas juridicas"},{"body":"* Se activa para colectivos específicos, no individualmente.\u003cbr\u003e* Tiene duración máxima de 1 año, prorrogable por períodos de 6 meses hasta un máximo de 2 años adicionales.\u003cbr\u003e* Los beneficiarios reciben un permiso de residencia temporal, acceso al empleo y a los servicios educativos y sociales básicos.\u003cbr\u003e* \u003cb\u003eEs compatible con la tramitación simultánea de una solicitud de protección internacional a nivel individual.\u003c/b\u003e","cat":"A","id":"nota-1789980872472","nota":102,"titulo":"Proteccion internacional"},{"body":"* \u003cb\u003e1ª Generación (Libertad — Civiles y Políticos):\u003c/b\u003e Derechos \"negativos\" de protección frente a la intromisión del Estado (derecho a la vida, libertad de expresión, voto e igualdad ante la ley)\u003cbr\u003e\u003cbr\u003e* \u003cb\u003e2ª Generación (Igualdad — Económicos, Sociales y Culturales):\u003c/b\u003e Derechos \"positivos\" que exigen una intervención activa del Estado (derecho al trabajo, educación, salud y Seguridad Social)\u003cbr\u003e\u003cbr\u003e* \u003cb\u003e3ª Generación (Solidaridad y Fraternidad):\u003c/b\u003e Centrados en la justicia, la paz y la cooperación internacional (derecho al medio ambiente, desarrollo y derechos de los pueblos)\u003cbr\u003e\u003cbr\u003e* \u003cb\u003e4ª Generación (Diversidad y Tecnología):\u003c/b\u003e Vinculados a los avances tecnológicos y la globalización (protección de datos, acceso al entorno digital y bioética","cat":"A","id":"nota-1789981124139","nota":103,"titulo":"Generaciones  Karel Vasak"},{"body":"Leve (Art. 37):** Descuido o pasividad (no hacértelo, perderlo 3 veces en un año, no denunciar su pérdida/robo o no entregarlo tras acordarse su retirada)\u003cbr\u003e\u003cbr\u003eGrave (Art. 36):** Oposición o engaño (negarte a identificarte ante los agentes, dar datos falsos al identificarte o mentir para obtener el documento","cat":"A","id":"nota-1789981918397","nota":104,"titulo":"Sancion DNI/IDENTIFICACION 4/2015"},{"body":"EXPANSIVA-PROGRESIVA-PAGODA-CLASICA\u003cbr\u003eESTACIONARIA-ESTANCADA-ESTABLE-CAMPANA\u003cbr\u003eREGRESIVA-ENVEJECIDA-BULBO-HUCHA-URNA","cat":"A","id":"nota-1789984617064","nota":105,"titulo":"Tipos de piramides"},{"body":"HTTP sin cifrar: CAPA PRESENTACIÓN.\u003cbr\u003e------------------------------------------------------------\u003cbr\u003e(PDU) Unidad de datos de la capas:\u003cbr\u003e         -Física | Bits\u003cbr\u003e         -Enlace | Tramas\u003cbr\u003e         -Red | Paquetes\u003cbr\u003e         -Transporte | Segmento\u003cbr\u003e         -Sesión, presentación, aplicación | Datos\u003cbr\u003e------------------------------------------------------------","id":"nota-1790064594741","nota":106,"titulo":"OSI"},{"body":"Plazo para acudir al TEDH tras agotar vías internas → 4 meses desde la resolución interna definitiva\u003cbr\u003e------------------------------------------------------------\u003cbr\u003eCargo creado por el Tratado de Ámsterdam (1997) → Alto Representante de la PESC (\"Mr. PESC\")\u003cbr\u003e-------------------------------------------------------------\u003cbr\u003eComité Ejecutivo del BCE → 6 miembros (Presidente + Vicepresidente + 4 más); mandato de 8 años, no renovable.\u003cbr\u003e-------------------------------------------------------------\u003cbr\u003eDefensor del Pueblo Europeo actual → Teresa Anjinho (portuguesa); sede en Estrasburgo.","id":"nota-1790066408607","nota":107,"titulo":"T4- UE"},{"body":"Negra-Cadaver\u003cbr\u003eRoja-Busca y captura\u003cbr\u003eNaranja-Precaucion\u003cbr\u003eAzul-Informac <b>8.1</b> Arma acústica y de salvas<br>
<b>9.1</b> Armas inutilizadas`},{id:"2",nota:2,cat:"H",titulo:"Tratados de la Unión Europea (Tema 4)",body:`
<b>París (1951/1952)</b> — CECA — 6 países. Plan Schuman. <i>[Fundacional]</i><br>
<b>Roma (1957/1958)</b> — CEE, Euratom, Mercado Común, BEI, FSE, Unión Aduanera. <i>[Fundacional]</i><br>
<b>Bruselas/Fusión (1965-1967)</b> — CECA+Euratom+CEE, Comisión, Consejo. <i>[Complementario]</i><br>
<b>Acta Única (1986/1987)</b> — Mayoría cualificada, P.E. oficial, España y Portugal. <i>[Modificativo]</i><br>
<b>Maastricht (1992/1993)</b> — Nace la UE, 3 pilares, ciudadanía UE, BCE, Europol. <i>[Fundacional]</i><br>
<b>Ámsterdam (1997/1999)</b> — Schengen, PESC. <i>[Modificativo]</i><br>
<b>Niza (2001/2003)</b> — De 15 a 25 miembros, Comité de Protección Social. <i>[Modificativo]</i><br>
<b>Lisboa (2007/2009)</b> — Personalidad jurídica única, inicia ciudadanía, presidencia del Consejo. <i>[Modificativo]</i>`},{id:"3",nota:3,cat:"F",titulo:"Plazos de medidas de investigación tecnológica",body:`
<b>Correspondencia:</b> Inicial 3 meses · Prórroga 18 meses · Urgencia 72h<br>
<b>Interceptación telefónica:</b> Inicial 3 meses · Prórroga 18 meses · Urgencia 72h<br>
<b>Grabación oral de encuentros:</b> sin plazo específico<br>
<b>Seguimiento y localización:</b> Inicial 3 meses · Prórroga 18 meses · Urgencia 24h<br>
<b>Dispositivos de captación masiva:</b> Urgencia 72h (sin plazo inicial/prórroga)<br>
<b>Registros remotos:</b> Inicial 1 mes · Prórroga 3 meses · sin plazo de urgencia`},{id:"4",nota:4,cat:"A",titulo:"El Gobierno: dirige y ejerce",body:`
<b>El Gobierno DIRIGE:</b><br>
<span class="ind1">• Política exterior e interior</span>
<span class="ind1">• Administración civil y militar</span>
<span class="ind1">• Defensa del Estado</span><br>
<b>El Gobierno EJERCE:</b><br>
<span class="ind1">• Función ejecutiva</span>
<span class="ind1">• Potestad reglamentaria de acuerdo a la CE y las leyes</span>`},{id:"5",nota:5,cat:"I",titulo:"Cumbres de Desarrollo Sostenible",body:`
<b>1ª Cumbre</b> — 1972 — Estocolmo. El Club de Roma publica "Los límites del crecimiento", que define por primera vez "desarrollo sostenible" → <b>"Nuestro futuro común"</b><br>
<b>2ª Cumbre</b> — 1992 — Río de Janeiro<br>
<b>3ª Cumbre</b> — 2002 — Río+10 — Johannesburgo<br>
<b>4ª Cumbre</b> — 2012 — Río+20 — Río de Janeiro → <b>"El futuro que queremos"</b><br>
Límite al calentamiento global por debajo de 2°C — COP21: 2015 — Objetivos de Desarrollo — Agenda 2030`,original:"Transcripción corregida aplicando un tachón y una flecha del original."},{id:"6",nota:6,cat:"J",titulo:"Pirámide de necesidades (Maslow)",body:`
1. Fisiológica <i>(base)</i><br>2. Seguridad<br>3. Afiliación<br>4. Reconocimiento<br>5. Autorrealización <i>(cúspide)</i><br><br>
<b>Deficit needs</b> (necesidades de déficit): N1, N2 → Fisiológica y Seguridad<br>
<b>Being needs</b> (necesidades de ser/crecimiento): N3, N4, N5 → Afiliación, Reconocimiento y Autorrealización`},{id:"7",nota:7,cat:"A",titulo:"Estructura de la Constitución (I)",body:`
Preámbulo + Título Preliminar + 10 Títulos + Disposiciones<br><br>
<b>Título Preliminar</b> — Art. 1-9<br>
<b>Título I</b> "Derechos y deberes fundamentales" Art. 10-55<br>
<span class="ind1">Art. 10</span>
<span class="ind1">Cap. I — De los españoles y extranjeros. Art. 11-13</span>
<span class="ind1">Cap. II — De los derechos y libertades. Art. 14-38</span>
<span class="ind2">Art. 14</span>
<span class="ind2">Sec. 1 — Libertades y derechos fundamentales. Art. 15-29</span>
<span class="ind2">Sec. 2 — Derechos y deberes de los ciudadanos. Art. 30-38</span>
<span class="ind1">Cap. III — Principios rectores de la política social y económica. Art. 39-52</span>
<span class="ind1">Cap. IV — De las garantías de los derechos fundamentales y libertades. Art. 53-54</span>
<span class="ind1">Cap. V — De la suspensión de los derechos fundamentales. Art. 55</span>
<b>Título II</b> "La Corona" Art. 56-65<br>
<b>Título III</b> "De las Cortes Generales" Art. 66-96<br>
<span class="ind1">Cap. I — De las Cámaras. Art. 66-80</span>
<span class="ind1">Cap. II — De la elaboración de las leyes. Art. 81-92</span>
<span class="ind1">Cap. III — De los tratados internacionales. Art. 93-96</span>
<b>Título IV</b> "Del Gobierno y la Administración" Art. 97-107<br>
<b>Título V</b> "De las relaciones entre el Gobierno y las Cortes Generales" Art. 108-116<br>
<b>Título VI</b> "Del Poder Judicial" Art. 117-127<br>
<b>Título VII</b> "Economía y Hacienda" Art. 128-136`},{id:"8",nota:8,cat:"A",titulo:"Estructura de la Constitución (II) y fechas clave",body:`
<b>Título VIII</b> — Organización territorial del Estado. Art. 137-158<br>
<span class="ind1">Cap. I — Principios generales. Art. 137-139</span>
<span class="ind1">Cap. II — Administración local. Art. 140-142</span>
<span class="ind1">Cap. III — De las CCAA. Art. 143-158</span>
<b>Título IX</b> — Del Tribunal Constitucional. Art. 159-165<br>
<b>Título X</b> — De la reforma constitucional. Art. 166-169<br><br>
<b>Disposiciones:</b> 4 adicionales · 9 transitorias · 1 derogatoria · 1 final<br><br>
<b>Fechas de la Constitución:</b><br>
<span class="ind1">31 octubre — Aprobación por las Cortes Generales</span>
<span class="ind1">6 diciembre — Ratificada por referéndum</span>
<span class="ind1">27 diciembre — El Rey sanciona y promulga</span>
<span class="ind1">29 diciembre — Publicación en el BOE y entrada en vigor</span>`},{id:"9",nota:9,cat:"A",titulo:"Recurso y cuestión de inconstitucionalidad",body:`
<b>Recurso de inconstitucionalidad</b> — legitimados:<br>
<span class="ind1">• Presidente del Gobierno</span>
<span class="ind1">• Defensor del Pueblo</span>
<span class="ind1">• 50 Diputados o 50 Senadores</span>
<span class="ind1">• Órganos colegiados y asambleas legislativas de las CCAA</span><br>
<b>Cuestión de inconstitucionalidad</b> — la plantean:<br>
<span class="ind1">• Jueces o Tribunales</span>`},{id:"10",nota:10,cat:"B",titulo:"Teoría del delito: las 4 preguntas",body:`
<b>¿Está descrita la conducta en el CP?</b> <i>(Tipicidad)</i><br>→ Causa de exclusión: <b>error de tipo invencible</b><br><br>
<b>¿Está justificada?</b> <i>(Antijuridicidad)</i><br>→ Causas: <b>minoría de edad, alteración psíquica, intoxicación…</b><br><br>
<b>¿Es responsable / imputable?</b> <i>(Culpabilidad)</i><br>→ Causas: <b>miedo insuperable, estado de necesidad</b><br><br>
<b>¿Se puede castigar?</b> <i>(Punibilidad)</i><br>→ Causa: <b>excusa absolutoria</b>`},{id:"11",nota:11,cat:"A",titulo:"Defensor del Pueblo: elección y nombramiento",body:`
<b>Elegido por:</b> Cortes Generales<br>
<b>Candidato propuesto por:</b> Comisión mixta Congreso-Senado<br>
<b>Nombrado por:</b> Firmas del Presidente del Congreso y del Senado<br>
<b>Toma de posesión ante:</b> Mesas del Congreso y del Senado reunidas conjuntamente`},{id:"12",nota:12,cat:"K",tags:["G"],titulo:"Funciones del Jefe de Seguridad",original:"Palabras clave recuadradas en rosa/rojo en el original.",body:`
<b>Palabras clave</b> — funciones del Jefe de Seguridad:<br>
<span class="ind1">• Servicios de seguridad reglamentaria</span>
<span class="ind1">• Traslado de armas</span>
<span class="ind1">• Formación</span>
<span class="ind1">• Normativa</span>
<span class="ind1">• Garantizar la colaboración</span>`},{id:"13",nota:13,cat:"A",titulo:"CGPJ: composición y mayorías",body:`
Mayoría requerida: <b>3/5</b> &nbsp;·&nbsp; Mandato: <b>5 años</b><br><br>
<b>Composición:</b> Presidente + 20 vocales<br>
<span class="ind1"><b>12 Jueces y Magistrados</b> — 6 por el Congreso (3/5) + 6 por el Senado (3/5)</span>
<span class="ind1"><b>8 Juristas</b> — 4 por el Congreso (3/5) + 4 por el Senado (3/5)</span>`},{id:"14",nota:14,cat:"A",titulo:"Tribunal Constitucional: composición",body:`
<b>12 miembros</b> (9 años, renovación por tercios)<br>
<span class="ind1">• 4 por el Congreso (3/5)</span>
<span class="ind1">• 4 por el Senado (3/5)</span>
<span class="ind1">• 2 por el Gobierno</span>
<span class="ind1">• 2 por el CGPJ</span><br>
El propio Tribunal elige a su presidente, por 3 años`},{id:"15",nota:15,cat:"C",titulo:"Corporaciones, asociaciones y fundaciones",body:`
<b>Corporaciones</b> → se rigen por Leyes<br>
<b>Asociaciones</b> → se rigen por Estatutos<br>
<b>Fundaciones</b> → se rigen por Reglas`},{id:"16",nota:16,cat:"C",titulo:"Declaración de fallecimiento: plazos",body:`
<b>Inmediato</b> — comprobado, no superviviente<br>
<b>8 días</b> — comprobado, puede haber supervivientes<br>
<b>1 mes</b> — presunto, aeronave/barco<br>
<b>3 meses</b> — siniestro, sin barco ni aeronave<br>
<b>1 año</b> — riesgo de muerte por violencia<br>
<b>2 años</b> — desaparición en campaña<br>
<b>5 años</b> — desde la desaparición si +75 años<br>
<b>10 años</b> — desaparición`},{id:"17",nota:17,cat:"E",titulo:"Extranjería: plazos clave",body:`
<b>Régimen comunitario (RD 240/2007):</b><br>
<span class="ind1">Inscripción RCE: 3M desde entrada</span>
<span class="ind1">Familiar no comunitario, solicitud tarjeta residencia: 3M</span>
<span class="ind1">Caducidad certificado de registro: 6M en 1 año</span>
<span class="ind1">Levantamiento prohibición de entrada: 3 años desde ejecución</span>
<span class="ind1">Resolución: 3M</span><br>
<b>TIE:</b><br>
<span class="ind1">Solicitud tras residencia +6M: 1 mes</span>
<span class="ind1">Renovación RLD menor 30 años: cada 5 años</span>
<span class="ind1">Renovación RLD mayor 30 años: cada 10 años</span>
<span class="ind1">Margen para renovar: 2M antes o hasta 3M después</span><br>
<b>Estancias:</b><br>
<span class="ind1">Denegación de prórroga sin visado: 72H para salir</span>
<span class="ind1">Información del R.C. de penados e infracciones policiales: 5 días</span><br>
<b>TSH (trata de seres humanos):</b><br>
<span class="ind1">Periodo de reflexión: mínimo 90 días</span>
<span class="ind1">Resolución del delegado/subdelegado: 5 días</span>
<span class="ind1">Resolución si la víctima está en CIE: 24H</span>
<span class="ind1">Silencio administrativo: positivo</span><br>
<b>MENA:</b><br>
<span class="ind1">Plazo máximo de repatriación: 6M</span>
<span class="ind1">Sin retorno efectivo, inicio trámite de residencia: 90 días</span><br>
<b>Arraigos:</b><br>
<span class="ind1">Todos los arraigos: autorización por 1 año</span>
<span class="ind1">Excepción — arraigo familiar: autorización por 5 años</span>`},{id:"18",nota:18,cat:"B",titulo:"Las cuatro garantías penales",body:`
<b>Garantía criminal</b> — <i>nullum crimen (delito) sine lege</i><br>

* Todas las penas, inferiores en 1 o 2 grados`},{id:"33",nota:33,cat:"F",tags:["D"],titulo:"Plazos del Tema 26 (LO 7/2021 – LO 3/2018)",body:`
<b>Faltas administrativas:</b> inmediato<br>
<b>Solicitud del interesado:</b> inmediato (máx. 1 mes)<br>
<b>Uso videocámaras móviles:</b> 24H<br>
<b>Delitos penales:</b> 72H<br>
<b>Dudas sobre identidad del solicitante:</b> 10 días<br>
<b>Admisión/inadmisión de reclamación ante la AEPD:</b> 3 meses<br>
<b>Solicitudes repetitivas:</b><br>
<span class="ind1">LO 7/2021: 3 sobre el mismo supuesto en 6H</span>
<span class="ind1">LO 3/2018: +1 en 6 meses</span>`},{id:"34",nota:34,cat:"D",titulo:"Infracciones y sanciones por ley",body:`
<b>LO 4/2015 (Seguridad Ciudadana):</b> Infracciones Leve 6M / Grave 1A / Muy Grave 2A — Sanción Leve 1A / Grave 2A / Muy Grave 3A<br>
<b>LO 4/2000 (Extranjería):</b> Infracciones Leve 6M / Grave 2A / Muy Grave 3A — Sanción Leve 1A / Grave 2A / Muy Grave 5A<br>
<b>Ley 5/2014 (Seguridad Privada):</b> Infracciones Leve 6M / Grave 1A / Muy Grave 2A — Sanción Leve 1A / Grave 2A / Muy Grave 4A<br>
<b>LO 4/2010 (Régimen CNP):</b> Infracciones y sanción Leve 1 Mes / Grave 2A / Muy Grave 3A<br>
<b>LO 3/2018 (Protección de Datos):</b> Infracciones y sanción Leve 1A / Grave 2A / Muy Grave 3A<br>
<b>LO 7/2021 (Protección de Datos):</b> Infracciones Leve 6M / Grave 2A / Muy Grave 3A — Sanción Leve 1A / Grave 2A / Muy Grave 3A`},{id:"35",nota:35,cat:"I",titulo:"DUDH y Consejo de Derechos Humanos",body:`
<b>Declaración Universal de los DDHH:</b> 1 preámbulo + 30 artículos<br><br>
<b>→ Órganos de control</b><br>
<b>Consejo de Derechos Humanos</b> — promociona y protege los DDHH<br>
<span class="ind1">Sede: Ginebra</span>
<span class="ind1">Reunión: 3 periodos de 10 semanas</span>
<span class="ind1">Miembros: 47, elegidos por 3 años (13 África, 13 Asia, 7 Europa Occ., 6 Europa Or., 8 América Latina)</span><br>
Pertenece a la Carta Internacional de los DH — Mesa: 1 presidente + 4 vicepresidentes (elegidos cada año) — presenta informe anual a la ONU`},{id:"36a",nota:36,cat:"B",titulo:"Atentado agravado por lanzamiento de objetos",original:"Resaltado en amarillo en el original.",body:"El lanzamiento de objetos peligrosos contra agentes de la autoridad no es tentativa, aunque no acierte — se considera <b>atentado agravado</b>."},{id:"36b",nota:36,cat:"J",titulo:"Estadios de Kohlberg",body:`
<b>1. Preconvencional</b><br>
<span class="ind1">Estadio 1 — Obediencia y castigo (miedo)</span>
<span class="ind1">Estadio 2 — Favorecer los propios intereses</span>
<b>2. Convencional</b><br>
<span class="ind1">Estadio 1 — Expectativas interpersonales</span>
<span class="ind1">Estadio 2 — Normas sociales</span>
<b>3. Postconvencional</b><br>
<span class="ind1">Estadio 1 — Derechos prioritarios</span>
<span class="ind1">Estadio 2 — Principios éticos</span>`},{id:"36c",nota:36,cat:"B",titulo:"Personas jurídicas: sin responsabilidad",original:"Resaltado en amarillo en el original.",body:"Las personas jurídicas <b>NO</b> tienen responsabilidad penal en el delito de aborto."},{id:"37",nota:37,cat:"D",tags:["A"],titulo:"Órganos superiores y directivos: creación y nombramiento",body:`
<b>Órganos superiores:</b><br>
<span class="ind1"><b>Ministros</b> — Crea: RD del Presidente del Gobierno / Nombra: el Rey a propuesta del Presidente</span>
<span class="ind1"><b>Secretarios de Estado</b> — Crea: RD del Presidente del Gobierno / Nombra: RD del Consejo de Ministros a propuesta del Presidente o Ministerio del que dependen</span><br>
<b>Órganos directivos:</b><br>
<span class="ind1">Creación — RD del Consejo de Ministros, a iniciativa del Ministro interesado y a propuesta del Ministerio de Transformación y Función Pública</span>
<span class="ind1"><b>Subsecretario</b> — RD del Consejo de Ministros a propuesta del titular del Ministerio (obligatorio)</span>
<span class="ind1"><b>Secretario General</b> — RD del Consejo de Ministros a propuesta del titular del Ministerio o Presidente</span>
<span class="ind1"><b>Secretario General Técnico</b> (obligatorio) — RD del Consejo de Ministros a propuesta del titular del Ministerio</span>
<span class="ind1"><b>Director General</b> — RD del Consejo de Ministros a propuesta del titular del Ministerio o del Presidente</span>
<span class="ind1"><b>Subdirector General</b> — el Ministro, Secretario de Estado o Subsecretario directamente</span>`},{id:"38a",nota:38,cat:"B",titulo:"Procedimientos penales según la pena",body:`
<b>Procedimiento ordinario:</b> +9 años — Instrucción: Sumario<br>
<b>Procedimiento abreviado:</b> hasta 9 años — Instrucción: Diligencias previas<br>
<b>Procedimiento de enjuiciamiento rápido:</b> hasta 5 años — Instrucción: Diligencias urgentes`},{id:"38b",nota:38,cat:"I",titulo:"Consejo de Europa, TEDH, CPT y Consejo DDHH (46 vs 47)",body:`
Consejo de Europa — <b>46</b><br>
Tribunal Europeo de Derechos Humanos (TEDH) — <b>46</b><br>
Comité Europeo para la Prevención de la Tortura (CPT) — <b>46</b><br>
Consejo de Derechos Humanos (ONU) — <b>47</b><br><br>
<b>Regla:</b> si es de la UE/Europa → 46 · si es internacional (ONU) → 47`},{id:"39",nota:39,cat:"A",titulo:"Tipos de mayoría parlamentaria",body:`
<b>Mayoría simple</b> → leyes ordinarias, trámite sencillo<br>
<b>Mayoría absoluta</b> → leyes orgánicas, veto, moción de censura (caída del gobierno)<br>
<b>Mayoría 3/5</b> → elección de jueces (vocales CGPJ, magistrados TC) o reforma de artículos "normales" de la Constitución<br>
<b>Mayoría 2/3</b> → cuestiones relativas a la Corona o reforma agravada de la Constitución`},{id:"40",nota:40,cat:"A",titulo:"Sistemas de votación en las Cortes",body:`
<b>Sesión conjunta:</b> Corona / cuestiones no legislativas del Título II<br>
<b>Solo Congreso:</b> control político del Gobierno<br>
<b>Primero Senado, después Congreso:</b> asuntos territoriales (CCAA) — comisiones mixtas si hay desacuerdo<br>
<b>Primero Congreso, después Senado:</b> elaboración de leyes comunes → Senado: 2 meses para enmendar/vetar → Congreso tiene la última palabra<br>
<b>Votación simultánea:</b> reforma de la CE → 2/3 · elección de jueces → 3/5`},{id:"41",nota:41,cat:"F",titulo:"Principios y medidas de investigación tecnológica",body:`
<b>Principios rectores:</b> especialidad, idoneidad, excepcionalidad, necesidad, proporcionalidad<br><br>
<b>Medidas:</b><br>
<span class="ind1">1. Interceptación de comunicaciones telefónicas — hasta 3M, prorrogable hasta 18M</span>
<span class="ind1">2. Captación de comunicaciones orales</span>
<span class="ind1">3. Apertura de correspondencia, telegrafía — hasta 3M, prorrogables hasta 18M</span>
<span class="ind1">4. Dispositivos técnicos de seguimiento y localización — hasta 3M, prorrogables hasta 18M</span>
<span class="ind1">5. Registro y almacenamiento masivo de datos</span>
<span class="ind1">6. Registro remoto de equipos informáticos — máx. 1M, prorrogable hasta 3M</span>`},{id:"42",nota:42,cat:"G",titulo:"PNPIC, PES, PSO, PPE y PAO",body:`
<b>PNPIC</b> — Elabora: MIR a través SES · Aprueba: SES · Registra/Actualiza: CNPIC · Revisa: SES<br>
<b>PES</b> — Elabora: Grupo de Trabajo · Aprueba: la Comisión (12M) · Registra: CNPIC · Revisa/Actualiza: cada 2 años, Ministerios y Organismos<br>
<b>PSO</b> (documentos estratégicos) — Elabora: O.P. (6M) · Registro: CNPIC · Aprueba: SES · Revisa: OC — Aprueba: CNPIC (2 años) · Actualiza: O.C.<br>
<b>PPE</b> (doc. operativo, medidas ya tomadas) — Elabora: OC (4M) · Aprueba: SES · Registra: Del. Gob. · Revisa/Actualiza: OC, aprobado por el Delegado del Gobierno<br>
<b>PAO</b> (doc. operativo, medidas a tomar por AAPP) — Elabora: Policía · Aprueba: SES · Registra: Del. Gob. · Revisa/Actualiza: Policía`},{id:"43a",nota:43,cat:"A",titulo:"Incompatibilidades, disolución y Defensor del Pueblo",body:`
No se puede ser Diputado y Senador simultáneamente<br>
Se prohíbe acumular acta de Asamblea de CCAA con la de Diputado — para Senadores: sí es posible<br>
El Presidente de una CCAA no puede ser Diputado (es miembro de la Asamblea)<br><br>
<b>Defensor del Pueblo:</b> elegido por las Cortes Generales a propuesta de la Comisión Mixta Congreso-Senado<br><br>
La disolución de las Cámaras la decreta el <b>Rey</b>`},{id:"43b",nota:43,cat:"H",titulo:"Tribunal de Justicia vs Tribunal General (UE)",body:`
Las cuestiones <b>prejudiciales</b> planteadas por tribunales nacionales las resuelve el <b>Tribunal de Justicia</b><br>
El <b>Tribunal General</b> resuelve cuestiones entre particulares`},{id:"44a",nota:44,cat:"H",titulo:"Mayoría cualificada en el Consejo de la UE",body:"Mayoría cualificada en el Consejo de la UE → <b>55% – 65%</b>"},{id:"44b",nota:44,cat:"G",titulo:"Interpol, Delegado del Gobierno y Relaciones Internacionales",body:`
<b>Notificaciones Interpol:</b><br>
<span class="ind1"><b>Naranja</b> — acontecimiento, persona u objeto que suponga grave peligro inminente para la Seguridad Pública</span>
<span class="ind1"><b>Morada</b> — Modus operandi</span>
<span class="ind1"><b>Azul</b> — conseguir más información de una persona</span><br>
Delegado del Gobierno — rango de Subsecretario<br>
Subdelegado del Gobierno — rango de Subdirector General<br><br>
<b>Dirección General de Relaciones Internacionales:</b><br>
<span class="ind1">SG Cooperación Internacional Policial</span>
<span class="ind1">SG Relaciones Internacionales, Inmigración y Extranjería</span>
<span class="ind1">SG Asuntos Europeos</span><br>
Oficina del Policía — S. General — Div. Personal`},{id:"45a",nota:45,cat:"G",titulo:"Brigadas técnicas, Oficina de Marca y acceso a la DGP",body:`
<b>B.I.T.</b> (Brigada Central Investigación Tecnológica) — delitos contra las personas cometidos mediante nuevas tecnologías<br>
<b>BC Fraude Informático</b> — fraudes<br>
<b>BSI</b> (BC. Seguridad Informática) — delitos de alta especialización, Fraude BEC<br>
Oficina de Marca — PN — C. Técnico<br><br>
Régimen del Personal DGP: se accede por Concurso-Oposición o Antigüedad (ascenso interno)`},{id:"45b",nota:45,cat:"E",titulo:"Clasificación de la residencia por tiempo",body:`
<b>Residencia general (&lt;5 años):</b> orden público, seguridad, salud pública<br>
<b>Residencia permanente (5-10 años):</b> razones graves de seguridad pública<br>
<b>Residencia de larga duración (+10 años):</b> razones imperiosas de seguridad pública`},{id:"46a",nota:46,cat:"A",titulo:"Senadores insulares, oficina presupuestaria y referéndum",body:`
<b>Senadores en las islas:</b> islas mayores 3 senadores · islas menores 1 senador<br>
Oficina presupuestaria — depende directamente del Titular de la Subsecretaría del Interior<br>
<b>Referéndum:</b> convocado por el Rey, propuesto por el Presidente del Gobierno, autorizado por las Cortes Generales<br><br>
Regla práctica: si el enunciado dice "sanciones", es sanción`},{id:"46b",nota:46,cat:"E",titulo:"Apatridia y renovación de residencia temporal no lucrativa",body:`
Solicitud de apatridia: 1 mes desde la entrada<br>
Renovación de residencia temporal no lucrativa: 2 años, salvo RDL`},{id:"46c",nota:46,cat:"G",titulo:"Coordinación internacional: CCP/CCPA y UIP",body:`
Coordinación CCP y CCPA — DGCYE<br>
Portugal: 5 (CCPA) · Francia: 4 (CCPA)<br>
UIP — Seguridad Ciudadana`},{id:"47",nota:47,cat:"A",titulo:"Jerarquía normativa española",body:`
<b>Ley Orgánica:</b> derechos fundamentales y libertades públicas — mayoría absoluta del Congreso<br>
<span class="ind1">Si afecta a las CCAA → también mayoría absoluta del Senado</span>
<span class="ind1">Dentro de la LO: Ley de Transferencia (el Estado da facultades a las CCAA)</span>
<b>Ley Ordinaria:</b> Leyes marco, Leyes de armonización<br>
<b>Decreto-Ley:</b> extraordinaria y urgente necesidad<br>
<b>Decreto Legislativo:</b> las Cortes Generales delegan en el Gobierno<br>
<span class="ind1">Ley de Bases → Texto Articulado</span>
<span class="ind1">Ley Ordinaria → Texto Refundido</span>`},{id:"48a",nota:48,cat:"G",titulo:"Gabinetes MIR/SES y periodicidad de auditorías",body:`
Gabinete MIR — Director General<br>
Gabinete SES — Subdirector General<br><br>
Auditorías PN → cada 5 años<br>
"Revisiones de evaluación inicial" (PN) → cada 4 años · general → cada 4 años`},{id:"48b",nota:48,cat:"J",titulo:"Rumores y aculturación",body:`
Teoría de los rumores — Allport y Postman<br><br>
<b>Asimilación</b> — el inmigrante pierde su identidad al incorporarse a la sociedad<br>
<b>Aculturación</b> — igual que la asimilación, pero NO se pierde la identidad; se integran elementos<br>
<b>Transculturación</b> — la cultura superior absorbe a la inferior`},{id:"49",nota:49,cat:"G",titulo:"SGT y el Defensor del Pueblo",body:"La SGT coordina las relaciones del Ministerio del Interior con el Defensor del Pueblo."},{id:"50a",nota:50,cat:"A",titulo:"Plazos del BOE y estados de alarma/excepción/sitio",body:`
Publicación en el BOE de una ley, sin fecha: <b>20 días</b><br>
Sanción de la ley para su publicación en el BOE por el Rey: <b>15 días</b><br>
Periodo de pago voluntario: <b>20 días</b><br><br>
<b>Alarma:</b> declara el Gobierno mediante Decreto del Consejo de Ministros <i>[mnemotecnia: GC]</i><br>
<b>Excepción:</b> declara el Gobierno mediante RD del Consejo de Ministros, con autorización del Congreso <i>[mnemotecnia: GC]</i><br>
<b>Sitio:</b> declara el Congreso a propuesta exclusiva del Gobierno <i>[mnemotecnia: CG]</i>`},{id:"50b",nota:50,cat:"B",titulo:"Procedimientos penales y delitos leves",body:`
<b>Procedimiento ordinario:</b> +9 años — Instrucción: Sumario<br>
<b>Procedimiento abreviado:</b> hasta 9 años — Instrucción: Diligencias previas<br>
<b>Procedimiento de enjuiciamiento rápido:</b> hasta 5 años — Instrucción: Diligencias urgentes<br>
<b>Delitos leves:</b> instruye y enjuicia`},{id:"51",nota:51,cat:"B",titulo:"Salas de los tribunales: mnemotecnias",body:`
<b>Tribunal Supremo (5 salas):</b> Civil, Penal, Contencioso-Administrativo, Social, Militar<br>
<span class="ind1">Mnemotecnia C-P-C-S-M → <b>CIPECOSOMI</b></span><br>
<b>Audiencia Nacional (4 salas):</b> Apelación, Penal (no civil), Contencioso-Administrativo, Social<br>
<span class="ind1">Mnemotecnia A-P-C-S → <b>APECOSO</b></span><br>
<b>Tribunal Superior de Justicia (3 salas):</b> Civil y Penal (Sala Común), Contencioso-Administrativo, Social<br>
<span class="ind1">Mnemotecnia → <b>CICOSO</b></span>`},{id:"52a",nota:52,cat:"H",titulo:"Fuentes del derecho de la UE",body:`
<b>Reglamento:</b> alcance general, obligatorio y directamente aplicable<br>
<b>Directiva:</b> obliga al destinatario en cuanto al objetivo a conseguir, no en la forma ni los medios<br>
<b>Decisión:</b> obligatoria en todos sus elementos<br>
Recomendaciones y dictámenes: no vinculantes`},{id:"52b",nota:52,cat:"D",titulo:"Validez de licencias y compartimentos penitenciarios",body:`
Años de validez del carnet/licencia tipo D: <b>5 años</b><br>
Espacios donde están presos y funcionarios M1/M2 → <b>compartimentos</b>`},{id:"53a",nota:53,cat:"A",titulo:"Presidente y Gobierno en funciones: DCR y P/P",body:`
<b>Presidente en funciones NO puede:</b><br>
<span class="ind1"><b>D</b> — Disolver las Cortes Generales</span>
<span class="ind1"><b>C</b> — Plantear cuestión de confianza</span>
<span class="ind1"><b>R</b> — Convocar referéndum consultivo</span><br>
<b>Gobierno en funciones NO puede:</b><br>
<span class="ind1"><b>P</b> — Presupuestos Generales del Estado (PGE)</span>
<span class="ind1"><b>P</b> — Presentar proyectos de ley a las Cortes</span>`},{id:"53b",nota:53,cat:"F",titulo:"Protección de datos de menores fallecidos",body:"En protección de datos, ante un menor fallecido se podrá actuar de oficio o a instancia de parte interesada."},{id:"53c",nota:53,cat:"G",titulo:"Excedencia por cuidado de familiares y factor humano",body:`
Excedencia por cuidado de familiares en el CNP → reserva del puesto: 2 años / destino: 3 años<br><br>
Factor esencial, base, no explícito → <b>Factor Humano</b>`},{id:"54a",nota:54,cat:"B",titulo:"Fuentes de inteligencia y registros corporales",body:`
Información procedente de imágenes e información geográfica → <b>IMINT</b><br>
Procede de fuentes técnicas → <b>SIGINT</b><br>
Procede de fuentes humanas → <b>HUMINT</b><br><br>
<b>Registros corporales — principios:</b> proporcionalidad, igualdad de trato, no discriminación, injerencia mínima<br>
Si el registro corporal es coactivo (por la fuerza): proporcionalidad, idoneidad, necesidad → mnemotecnia <b>P.I.N.</b><br>
Se informa de las razones y se deja constancia por escrito`},{id:"54b",nota:54,cat:"G",titulo:"Oficina de Delitos de Odio",body:"Oficina de Delitos de Odio → <b>DGCYE</b>"},{id:"55a",nota:55,cat:"H",titulo:"Supervisor Europeo de Protección de Datos y pilares de Maastricht",body:`
Supervisor Europeo de Protección de Datos: mandato de <b>5 años</b><br><br>
<b>Pilares de Maastricht:</b><br>
<span class="ind1">1º Pilar — Comunidades Europeas</span>
<span class="ind1">2º Pilar — PESC</span>
<span class="ind1">3º Pilar — JAI</span>`},{id:"55b",nota:55,cat:"I",titulo:"Subcomité para la Prevención de la Tortura",body:`
Subcomité de prevención de la tortura — periodo de sesiones: <b>3</b><br>
Protocolo del Convenio contra la Tortura → Preámbulo y 37 artículos<br><br>
2001 — Contracumbre de Génova → <b>G8</b>`},{id:"55c",nota:55,cat:"C",titulo:"Derecho privado",body:"Derecho Civil y Mercantil → <b>Derecho Privado</b>"},{id:"55d",nota:55,cat:"J",titulo:"Definiciones de ciudad",body:`
<b>Wirth</b> — cita "Heterogéneos"<br>
<b>Ratzel</b> — cita "Grandes vías comerciales"<br>
<b>Sorre</b> — cita "Organización social"`},{id:"55e",nota:55,cat:"L",titulo:"Datos sueltos: DGCYE, DARPA e inducción al suicidio",body:`
Información estadística sobre la evolución de la criminalidad → <b>DGCYE</b><br>
DARPA — Departamento de Defensa de EEUU<br><br>
La inducción al suicidio se pena <b>más</b> que la cooperación necesaria al suicidio`},{id:"56a",nota:56,cat:"B",titulo:"Detención preventiva de adultos",body:"Detención preventiva (adultos) → estrictamente necesaria y máximo <b>72H</b>"},{id:"56b",nota:56,cat:"L",titulo:"Datos sueltos: prevención laboral, rootkit y MS-DOS",body:`
El empresario consulta las decisiones preventivas con los representantes de los trabajadores<br>
<b>Rootkit</b> — software malicioso de control total<br>
<b>MS-DOS</b> — monotarea, monousuario`},{id:"56c",nota:56,cat:"A",titulo:"Administración militar, seguridad ciudadana y origen de la UE",body:`
Dirección de la Administración Militar → <b>Gobierno</b><br>
Proponer y ejecutar la política del Gobierno en materia de Seguridad Ciudadana → <b>MIR</b><br>
La UE se establece formalmente en el Tratado de Maastricht`},{id:"57a",nota:57,cat:"B",titulo:"Riña tumultuaria",body:"La riña tumultuaria no constituye actos preparatorios."},{id:"57b",nota:57,cat:"J",titulo:"Tipos de racismo",body:`
<b>Tradicional</b> — hay jerarquía de razas<br>
<b>Simbólico</b> — no son racistas, pero se oponen a políticas de igualdad racial<br>
<b>Moderno</b> — las minorías amenazan los valores de la mayoría<br>
<b>Aversivo</b> — cree honestamente en la igualdad, pero se siente incómodo<br>
<b>Latente</b> — está ahí pero no se ve, "se encuentra dormido"<br>
<b>Ambivalente</b> — sentimientos positivos y negativos a la vez<br>
<b>Sutil</b> — no ataca de frente, pero actúa defendiendo valores tradicionales`},{id:"57c",nota:57,cat:"G",titulo:"Excedencia por cuidado de familiares en el CNP",body:`
En la PN, excedencia por cuidado de familiares:<br>
<span class="ind1">Reserva de puesto = salario (misma localidad)</span>
<span class="ind1">Al menos 2 años</span>`},{id:"58",nota:58,cat:"J",titulo:"Pirámide de Davenport y Prusak",body:`
1. Inteligencia<br>2. Conocimiento<br>3. Información<br>4. Dato`},{id:"59a",nota:59,cat:"D",titulo:"Recursos administrativos",body:`
<b>Alzada:</b> se acude a un superior jerárquico → dirigido a actos que <b>NO</b> ponen fin a la vía administrativa<br>
<b>Reposición:</b> es como pedir una revisión → dirigido a actos que <b>ponen fin</b> a la vía administrativa<br>
<b>Revisión:</b> se solicita si hay nuevos documentos o errores → sentencias firmes o cerradas<br>
<b>Reexamen:</b> puestos fronterizos y CIE → 2 días (solicitud) / 2 días (resolución)`},{id:"59b",nota:59,cat:"K",titulo:"Licencia de armas Tipo F: categorías",body:`
<b>1ª categoría:</b> hasta 10 armas<br>
<b>2ª categoría:</b> hasta 6 armas<br>
<b>3ª categoría:</b> 1 arma corta o 1 arma larga`},{id:"60a",nota:60,cat:"L",titulo:"Antes de iniciar la conducción",body:`
1. Altura del asiento<br>2. Inclinación del respaldo<br>3. Distancia pedales/volante<br>4. Reposacabezas<br>5. Posición del volante<br>6. Retrovisores<br>7. Cinturón`},{id:"60b",nota:60,cat:"B",titulo:"Extorsión y coacción",body:`
<b>Extorsión:</b> acto o negocio jurídico, con ánimo de lucro<br>
<b>Coacción:</b> impedir hacer lo que la ley no prohíbe, o compeler a hacer lo que no se quiere`},{id:"61a",nota:61,cat:"C",titulo:"Emancipación",body:`
<b>Concesión paterna</b> — el menor la consiente, se inscribe en el Registro Civil<br>
<b>Concesión judicial</b> — la pide el menor, edad 16 años. Se concede si:<br>
<span class="ind1">Padre o madre (patria potestad) vive con otra persona</span>
<span class="ind1">Padres separados</span>
<span class="ind1">Causa que entorpezca la patria potestad</span>
<b>Vida independiente</b> — los padres consienten, única revocable`},{id:"61b",nota:61,cat:"B",titulo:"Tribunal del Jurado",body:"El Tribunal del Jurado nunca enjuicia delitos de la Audiencia Nacional (la Audiencia Provincial sí)."},{id:"61c",nota:61,cat:"J",titulo:"Racismo sutil",body:"Racismo sutil — Pettigrew y Meertens"},{id:"61d",nota:61,cat:"G",titulo:"DAO: uniformes y colaboración policía judicial",body:`
¿Quién autoriza los cambios de uniforme invierno-verano en la DGP? → <b>DAO</b><br>
Funciones de las CCAA en Policía Judicial → en colaboración con las <b>FFCCSS</b>`},{id:"62a",nota:62,cat:"B",titulo:"Accidente blanco y asistencia a víctimas",body:`
<b>Accidente blanco</b> → daños a bienes, no a personas<br><br>
Fase de servicio de asistencia a víctimas: <b>4 fases</b>`},{id:"62b",nota:62,cat:"H",titulo:"Consejo de Europa y Tratado de París",body:`
Consejo de Europa — se creó en <b>1949</b><br>
<b>1951</b> — firma del Tratado de París`},{id:"62c",nota:62,cat:"F",titulo:"Plazos de resolución y caducidad (LO 7/2021 vs LO 3/2018)",body:`
<b>LO 7/2021:</b> si no contestan en 1 mes, se entiende desestimada. Caducidad de procedimientos: 6 meses<br>
<b>LO 3/2018:</b> reclamaciones AEPD, 3 meses para responder, silencio positivo. Caducidad de procedimientos: 12 meses`},{id:"62d",nota:62,cat:"I",titulo:"Visitas del SPT y el CPT",body:"Las visitas del SPT y el CPT → mínimo 2 personas. Aparte, máximo 5 personas, propuestas por los estados para ir a visitar."},{id:"63a",nota:63,cat:"G",titulo:"DAO: suplencia y UPEC",body:`
DAO — suplencia: SDG RRHH / Logística e Innovación<br>
Depende de la <b>UPEC</b> → Área de Seguimiento, Inteligencia (Estadística Criminal) y Planificación`},{id:"63b",nota:63,cat:"H",titulo:"Tratado de Maastricht: nacimiento de la UE",body:"El Tratado de Maastricht establece formalmente la Unión Europea."},{id:"63c",nota:63,cat:"A",titulo:"Órganos superiores del Estado: funciones",body:`
<b>Secretario de Estado</b> → ejecuta la acción del Gobierno en un sector específico<br>
<b>Ministro</b> → dirige la actividad administrativa<br>
<b>Subsecretario</b> → ostenta la representación, servicios comunes<br>
<b>SGT</b> → normativa, asistencia jurídica y publicaciones<br>
<b>Director General</b> → gestiona áreas funcionalmente homogéneas`},{id:"64a",nota:64,cat:"F",titulo:"Reclamaciones ante la AEPD: plazos",body:`
Reclamas a la AEPD: <b>3 meses</b><br>
<span class="ind1">¿Se admite? — 6 meses para reconocer tus derechos</span>
<span class="ind1">Procedimiento sancionador — 12 meses</span>`},{id:"64b",nota:64,cat:"G",tags:["D"],titulo:"Principios de promoción y provisión de puestos",body:`
<b>Policía — Promoción (social/humana):</b> objetividad, igualdad, mérito, capacidad<br>
<b>Policía — Provisión (destinos):</b> mérito, capacidad, antigüedad<br><br>
<b>TREBEP:</b><br>
<span class="ind1">Acceso/ingreso: igualdad, mérito, capacidad</span>
<span class="ind1">Provisión de puestos: publicidad y celeridad</span>
<span class="ind1">Interinos: igualdad, mérito, capacidad, publicidad y celeridad</span>

Mando directo: <b>Subdelegado/Delegado / DGP</b>`},{id:"65c",nota:65,cat:"F",titulo:"Delegado de Protección de Datos: nombramiento",body:"Tanto el encargado como el responsable del tratamiento pueden nombrar al Delegado de Protección de Datos."},{id:"66a",nota:66,cat:"C",tags:["G"],titulo:"Registro Nacional de Asociaciones",body:"Registro Nacional de Asociaciones → depende de la <b>SGT</b>"},{id:"66b",nota:66,cat:"I",titulo:"FMI y Banco Mundial",body:`
