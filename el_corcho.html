<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Corcho — Repaso CNP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cork-1:#4a3423; --cork-2:#3a2818; --cork-edge:#2a1c10;
  --frame:#241a10; --brass:#c9a15a;
  --ink:#241f1a; --paper-shadow: rgba(0,0,0,.45);
  --A:#f6c453; --A-t:#3a2c00;
  --B:#e5573f; --B-t:#3a0d05;
  --C:#7fc383; --C-t:#0d2b0f;
  --D:#f2a35c; --D-t:#3a1f00;
  --E:#5aa9e6; --E-t:#04203a;
  --F:#a97fe0; --F-t:#25073a;
  --G:#3fb8af; --G-t:#00302c;
  --H:#5b78ea; --H-t:#0a1440;
  --I:#f2a6c1; --I-t:#40071e;
  --J:#a3c65a; --J-t:#1c2900;
  --K:#a7b0ba; --K-t:#1a1f24;
  --L:#cdbfa5; --L-t:#2b2010;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.03), transparent 40%),
    radial-gradient(ellipse at 80% 90%, rgba(255,255,255,.02), transparent 40%),
    repeating-radial-gradient(circle at 0 0, rgba(0,0,0,.08) 0, rgba(0,0,0,.08) 1px, transparent 1px, transparent 3px),
    linear-gradient(160deg, var(--cork-1), var(--cork-2));
  color:#f1e9db;
  min-height:100vh;
}
/* wooden frame border feel */
.board-frame{
  border:14px solid var(--frame);
  border-image: linear-gradient(135deg,#3a2a1a,#1c130b,#3a2a1a) 1;
  min-height:100vh;
}

header{
  padding:28px 5vw 18px;
  text-align:center;
  position:relative;
}
header::after{
  content:"";
  display:block;
  width:120px; height:3px; margin:14px auto 0;
  background:var(--brass);
  opacity:.6;
}
h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:clamp(2.1rem,5vw,3.4rem);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin:0;
  color:#f6ead2;
  text-shadow: 0 2px 0 rgba(0,0,0,.5);
}
h1 span{color:var(--brass);}
.subtitle{
  font-family:'Oswald',sans-serif;
  font-weight:400;
  letter-spacing:.15em;
  text-transform:uppercase;
  font-size:.78rem;
  color:#c9b998;
  margin-top:6px;
}
.stats{
  font-family:'Inter',sans-serif;
  font-size:.78rem;
  color:#a9977a;
  margin-top:10px;
}
.stats b{color:#f1e9db;}

.controls{
  max-width:1100px;
  margin:0 auto 8px;
  padding:0 5vw;
}
.searchbar{
  display:flex; gap:10px; align-items:center;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  padding:10px 14px;
  margin-bottom:14px;
}
.searchbar input{
  flex:1; background:none; border:none; outline:none;
  color:#f1e9db; font-family:'Inter',sans-serif; font-size:.95rem;
}
.searchbar input::placeholder{color:#8a7c66;}
.searchbar svg{flex:none; opacity:.6;}

.chips{
  display:flex; flex-wrap:wrap; gap:8px;
  margin-bottom:6px;
}
.chip{
  font-family:'Oswald',sans-serif;
  font-size:.72rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:7px 13px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.04);
  color:#d8cbb2;
  cursor:pointer;
  user-select:none;
  transition:transform .12s ease, box-shadow .12s ease;
  display:flex; align-items:center; gap:7px;
}
.chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.chip.active{
  background:var(--c,#666); color:var(--ct,#111);
  border-color:transparent;
  box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.chip:hover{transform:translateY(-1px);}
.chip-all{margin-right:4px;}

.board{
  max-width:1400px;
  margin:0 auto;
  padding:18px 5vw 60px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:26px 22px;
}
.postit{
  position:relative;
  background: var(--c);
  color: var(--ct);
  padding:20px 16px 16px;
  min-height:150px;
  box-shadow: 3px 6px 14px var(--paper-shadow), 0 1px 0 rgba(255,255,255,.25) inset;
  cursor:pointer;
  transform:rotate(var(--rot,0deg));
  transition:transform .15s ease, box-shadow .15s ease, z-index 0s;
  font-family:'Kalam',cursive;
  display:flex; flex-direction:column;
}
.postit:hover{
  transform:rotate(0deg) scale(1.045);
  box-shadow: 4px 10px 22px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.3) inset;
  z-index:5;
}
.postit::before{ /* torn/curled corner */
  content:"";
  position:absolute; right:0; bottom:0;
  width:22px; height:22px;
  background:linear-gradient(135deg, transparent 50%, rgba(0,0,0,.18) 50%);
}
.pin{
  position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  width:16px; height:16px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff8a80, #b3261e 70%);
  box-shadow:0 3px 4px rgba(0,0,0,.5);
}
.pit-head{
  display:flex; justify-content:space-between; align-items:flex-start;
  font-family:'Oswald',sans-serif;
  font-size:.66rem; letter-spacing:.05em; text-transform:uppercase;
  opacity:.75; margin-bottom:8px;
}
.pit-title{
  font-weight:700; font-size:1.18rem; line-height:1.18;
  margin-bottom:8px;
}
.pit-snippet{
  font-size:.98rem; line-height:1.32; opacity:.9;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical;
  flex:1;
}
.pit-cat{
  margin-top:10px; font-family:'Oswald',sans-serif; font-size:.62rem;
  letter-spacing:.06em; text-transform:uppercase; opacity:.7;
}

.empty-msg{
  grid-column:1/-1; text-align:center; padding:50px 10px;
  font-family:'Oswald',sans-serif; letter-spacing:.06em; text-transform:uppercase;
  color:#a9977a; font-size:.9rem;
}

/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(10,6,3,.72);
  display:none; align-items:center; justify-content:center;
  padding:24px; z-index:50;
  backdrop-filter:blur(2px);
}
.overlay.open{display:flex;}
.modal{
  width:min(640px, 100%);
  max-height:86vh; overflow-y:auto;
  background: var(--c);
  color:var(--ct);
  padding:34px 30px 28px;
  position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  font-family:'Kalam',cursive;
}
.modal .pin{top:-10px;}
.modal-close{
  position:absolute; top:14px; right:16px;
  font-family:'Oswald',sans-serif; font-size:1.3rem;
  background:none; border:none; color:inherit; opacity:.6; cursor:pointer;
}
.modal-close:hover{opacity:1;}
.modal-head{
  font-family:'Oswald',sans-serif; font-size:.72rem; letter-spacing:.06em;
  text-transform:uppercase; opacity:.75; margin-bottom:10px;
  display:flex; gap:10px; flex-wrap:wrap;
}
.modal-title{font-weight:700; font-size:1.55rem; margin-bottom:14px; line-height:1.2;}
.modal-body{font-size:1.15rem; line-height:1.55;}
.modal-body .ind1{margin-left:20px; display:block;}
.modal-body .ind2{margin-left:40px; display:block;}
.modal-body b{font-weight:700;}
.modal-body .orig-note{
  margin-top:16px; padding-top:12px; border-top:2px dashed rgba(0,0,0,.25);
  font-family:'Inter',sans-serif; font-size:.8rem; opacity:.75;
}
.tagpill{
  display:inline-block; padding:2px 9px; border-radius:10px;
  background:rgba(0,0,0,.15);
}

footer{
  text-align:center; padding:20px 5vw 40px;
  font-family:'Inter',sans-serif; font-size:.75rem; color:#8a7c66;
}
@media (max-width:520px){
  .board{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:20px 14px;}
  .modal{padding:26px 20px 22px;}
}
</style>
</head>

{id:'14',nota:14,cat:'A',titulo:'Tribunal Constitucional: composición',body:`

{id:'16',nota:16,cat:'C',titulo:'Declaración de fallecimiento: plazos',body:`
<b>Inmediato</b> — comprobado, no superviviente<br>

{id:'17',nota:17,cat:'E',titulo:'Extranjería: plazos clave',body:`
<b>Régimen comunitario (RD 240/2007):</b><br>
<span class="ind1">Inscripción RCE: 3M desde entrada</span>
<span class="ind1">Familiar no comunitario, solicitud tarjeta residencia: 3M</span>
<span class="ind1">Caducidad certificado de registro: 6M en 1 año</span>
<span class="ind1">Levantamiento prohibición de entrada: 3 años desde ejecución</span>
<span class="ind1">Resolución: 3M</span><br>
<b>TIE:</b><br>
<span class="ind1">Solicitud tras residencia +6M: 1 mes</span>
<span class="ind1">Renovación RLD menor 30 años: cada 5 años</span>
<span class="ind1">Renovación RLD mayor 30 años: cada 10 años</span>
<span class="ind1">Margen para renovar: 2M antes o hasta 3M después</span><br>
<b>Estancias:</b><br>
<span class="ind1">Denegación de prórroga sin visado: 72H para salir</span>
<span class="ind1">Información del R.C. de penados e infracciones policiales: 5 días</span><br>
<b>TSH (trata de seres humanos):</b><br>
<span class="ind1">Periodo de reflexión: mínimo 90 días</span>
<span class="ind1">Resolución del delegado/subdelegado: 5 días</span>
<span class="ind1">Resolución si la víctima está en CIE: 24H</span>
<span class="ind1">Silencio administrativo: positivo</span><br>
<b>MENA:</b><br>
<span class="ind1">Plazo máximo de repatriación: 6M</span>
<span class="ind1">Sin retorno efectivo, inicio trámite de residencia: 90 días</span><br>
<b>Arraigos:</b><br>
<span class="ind1">Todos los arraigos: autorización por 1 año</span>
<span class="ind1">Excepción — arraigo familiar: autorización por 5 años</span>`},

{id:'18',nota:18,cat:'B',titulo:'Las cuatro garantías penales',body:`

{id:'35',nota:35,cat:'I',titulo:'DUDH y Consejo de Derechos Humanos',body:`
<b>Declaración Universal de los DDHH:</b> 1 preámbulo + 30 artículos<br><br>
<b>→ Órganos de control</b><br>
<b>Consejo de Derechos Humanos</b> — promociona y protege los DDHH<br>
<span class="ind1">Sede: Ginebra</span>
<span class="ind1">Reunión: 3 periodos de 10 semanas</span>
<span class="ind1">Miembros: 47, elegidos por 3 años (13 África, 13 Asia, 7 Europa Occ., 6 Europa Or., 8 América Latina)</span><br>
Pertenece a la Carta Internacional de los DH — Mesa: 1 presidente + 4 vicepresidentes (elegidos cada año) — presenta informe anual a la ONU`},

{id:'36a',nota:36,cat:'B',titulo:'Atentado agravado por lanzamiento de objetos',original:'Resaltado en amarillo en el original.',body:`El lanzamiento de objetos peligrosos contra agentes de la autoridad no es tentativa, aunque no acierte — se considera <b>atentado agravado</b>.`},

{id:'36b',nota:36,cat:'J',titulo:'Estadios de Kohlberg',body:`
<b>1. Preconvencional</b><br>
<span class="ind1">Estadio 1 — Obediencia y castigo (miedo)</span>
<span class="ind1">Estadio 2 — Favorecer los propios intereses</span>
<b>2. Convencional</b><br>
<span class="ind1">Estadio 1 — Expectativas interpersonales</span>
<span class="ind1">Estadio 2 — Normas sociales</span>
<b>3. Postconvencional</b><br>
<span class="ind1">Estadio 1 — Derechos prioritarios</span>
<span class="ind1">Estadio 2 — Principios éticos</span>`},

{id:'36c',nota:36,cat:'B',titulo:'Personas jurídicas: sin responsabilidad',original:'Resaltado en amarillo en el original.',body:`Las personas jurídicas <b>NO</b> tienen responsabilidad penal en el delito de aborto.`},

{id:'37',nota:37,cat:'D',tags:['A'],titulo:'Órganos superiores y directivos: creación y nombramiento',body:`
<b>Órganos superiores:</b><br>
<span class="ind1"><b>Ministros</b> — Crea: RD del Presidente del Gobierno / Nombra: el Rey a propuesta del Presidente</span>
<span class="ind1"><b>Secretarios de Estado</b> — Crea: RD del Presidente del Gobierno / Nombra: RD del Consejo de Ministros a propuesta del Presidente o Ministerio del que dependen</span><br>
<b>Órganos directivos:</b><br>
<span class="ind1">Creación — RD del Consejo de Ministros, a iniciativa del Ministro interesado y a propuesta del Ministerio de Transformación y Función Pública</span>
<span class="ind1"><b>Subsecretario</b> — RD del Consejo de Ministros a propuesta del titular del Ministerio (obligatorio)</span>
<span class="ind1"><b>Secretario General</b> — RD del Consejo de Ministros a propuesta del titular del Ministerio o Presidente</span>
<span class="ind1"><b>Secretario General Técnico</b> (obligatorio) — RD del Consejo de Ministros a propuesta del titular del Ministerio</span>
<span class="ind1"><b>Director General</b> — RD del Consejo de Ministros a propuesta del titular del Ministerio o del Presidente</span>
<span class="ind1"><b>Subdirector General</b> — el Ministro, Secretario de Estado o Subsecretario directamente</span>`},

{id:'38a',nota:38,cat:'B',titulo:'Procedimientos penales según la pena',body:`
<b>Procedimiento ordinario:</b> +9 años — Instrucción: Sumario<br>
<b>Procedimiento abreviado:</b> hasta 9 años — Instrucción: Diligencias previas<br>
<b>Procedimiento de enjuiciamiento rápido:</b> hasta 5 años — Instrucción: Diligencias urgentes`},

{id:'38b',nota:38,cat:'I',titulo:'Consejo de Europa, TEDH, CPT y Consejo DDHH (46 vs 47)',body:`
Consejo de Europa — <b>46</b><br>
Tribunal Europeo de Derechos Humanos (TEDH) — <b>46</b><br>
Comité Europeo para la Prevención de la Tortura (CPT) — <b>46</b><br>
Consejo de Derechos Humanos (ONU) — <b>47</b><br><br>
<b>Regla:</b> si es de la UE/Europa → 46 · si es internacional (ONU) → 47`},

{id:'39',nota:39,cat:'A',titulo:'Tipos de mayoría parlamentaria',body:`
<b>Mayoría simple</b> → leyes ordinarias, trámite sencillo<br>
<b>Mayoría absoluta</b> → leyes orgánicas, veto, moción de censura (caída del gobierno)<br>
<b>Mayoría 3/5</b> → elección de jueces (vocales CGPJ, magistrados TC) o reforma de artículos "normales" de la Constitución<br>
<b>Mayoría 2/3</b> → cuestiones relativas a la Corona o reforma agravada de la Constitución`},

{id:'40',nota:40,cat:'A',titulo:'Sistemas de votación en las Cortes',body:`
<b>Sesión conjunta:</b> Corona / cuestiones no legislativas del Título II<br>
<b>Solo Congreso:</b> control político del Gobierno<br>
<b>Primero Senado, después Congreso:</b> asuntos territoriales (CCAA) — comisiones mixtas si hay desacuerdo<br>
<b>Primero Congreso, después Senado:</b> elaboración de leyes comunes → Senado: 2 meses para enmendar/vetar → Congreso tiene la última palabra<br>
<b>Votación simultánea:</b> reforma de la CE → 2/3 · elección de jueces → 3/5`},

{id:'41',nota:41,cat:'F',titulo:'Principios y medidas de investigación tecnológica',body:`
<b>Principios rectores:</b> especialidad, idoneidad, excepcionalidad, necesidad, proporcionalidad<br><br>
<b>Medidas:</b><br>
<span class="ind1">1. Interceptación de comunicaciones telefónicas — hasta 3M, prorrogable hasta 18M</span>
<span class="ind1">2. Captación de comunicaciones orales</span>
<span class="ind1">3. Apertura de correspondencia, telegrafía — hasta 3M, prorrogables hasta 18M</span>
<span class="ind1">4. Dispositivos técnicos de seguimiento y localización — hasta 3M, prorrogables hasta 18M</span>
<span class="ind1">5. Registro y almacenamiento masivo de datos</span>
<span class="ind1">6. Registro remoto de equipos informáticos — máx. 1M, prorrogable hasta 3M</span>`},

{id:'42',nota:42,cat:'G',titulo:'PNPIC, PES, PSO, PPE y PAO',body:`
<b>PNPIC</b> — Elabora: MIR a través SES · Aprueba: SES · Registra/Actualiza: CNPIC · Revisa: SES<br>
<b>PES</b> — Elabora: Grupo de Trabajo · Aprueba: la Comisión (12M) · Registra: CNPIC · Revisa/Actualiza: cada 2 años, Ministerios y Organismos<br>
<b>PSO</b> (documentos estratégicos) — Elabora: O.P. (6M) · Registro: CNPIC · Aprueba: SES · Revisa: OC — Aprueba: CNPIC (2 años) · Actualiza: O.C.<br>
<b>PPE</b> (doc. operativo, medidas ya tomadas) — Elabora: OC (4M) · Aprueba: SES · Registra: Del. Gob. · Revisa/Actualiza: OC, aprobado por el Delegado del Gobierno<br>
<b>PAO</b> (doc. operativo, medidas a tomar por AAPP) — Elabora: Policía · Aprueba: SES · Registra: Del. Gob. · Revisa/Actualiza: Policía`},

{id:'43a',nota:43,cat:'A',titulo:'Incompatibilidades, disolución y Defensor del Pueblo',body:`
No se puede ser Diputado y Senador simultáneamente<br>
Se prohíbe acumular acta de Asamblea de CCAA con la de Diputado — para Senadores: sí es posible<br>
El Presidente de una CCAA no puede ser Diputado (es miembro de la Asamblea)<br><br>
<b>Defensor del Pueblo:</b> elegido por las Cortes Generales a propuesta de la Comisión Mixta Congreso-Senado<br><br>
La disolución de las Cámaras la decreta el <b>Rey</b>`},

{id:'43b',nota:43,cat:'H',titulo:'Tribunal de Justicia vs Tribunal General (UE)',body:`
Las cuestiones <b>prejudiciales</b> planteadas por tribunales nacionales las resuelve el <b>Tribunal de Justicia</b><br>
El <b>Tribunal General</b> resuelve cuestiones entre particulares`},

{id:'44a',nota:44,cat:'H',titulo:'Mayoría cualificada en el Consejo de la UE',body:`Mayoría cualificada en el Consejo de la UE → <b>55% – 65%</b>`},

{id:'44b',nota:44,cat:'G',titulo:'Interpol, Delegado del Gobierno y Relaciones Internacionales',body:`
<b>Notificaciones Interpol:</b><br>
<span class="ind1"><b>Naranja</b> — acontecimiento, persona u objeto que suponga grave peligro inminente para la Seguridad Pública</span>
<span class="ind1"><b>Morada</b> — Modus operandi</span>
<span class="ind1"><b>Azul</b> — conseguir más información de una persona</span><br>
Delegado del Gobierno — rango de Subsecretario<br>
Subdelegado del Gobierno — rango de Subdirector General<br><br>
<b>Dirección General de Relaciones Internacionales:</b><br>
<span class="ind1">SG Cooperación Internacional Policial</span>
<span class="ind1">SG Relaciones Internacionales, Inmigración y Extranjería</span>
<span class="ind1">SG Asuntos Europeos</span><br>
Oficina del Policía — S. General — Div. Personal`},

{id:'45a',nota:45,cat:'G',titulo:'Brigadas técnicas, Oficina de Marca y acceso a la DGP',body:`
<b>B.I.T.</b> (Brigada Central Investigación Tecnológica) — delitos contra las personas cometidos mediante nuevas tecnologías<br>
<b>BC Fraude Informático</b> — fraudes<br>
<b>BSI</b> (BC. Seguridad Informática) — delitos de alta especialización, Fraude BEC<br>
Oficina de Marca — PN — C. Técnico<br><br>
Régimen del Personal DGP: se accede por Concurso-Oposición o Antigüedad (ascenso interno)`},

{id:'45b',nota:45,cat:'E',titulo:'Clasificación de la residencia por tiempo',body:`
<b>Residencia general (&lt;5 años):</b> orden público, seguridad, salud pública<br>
<b>Residencia permanente (5-10 años):</b> razones graves de seguridad pública<br>
<b>Residencia de larga duración (+10 años):</b> razones imperiosas de seguridad pública`},

{id:'46a',nota:46,cat:'A',titulo:'Senadores insulares, oficina presupuestaria y referéndum',body:`
<b>Senadores en las islas:</b> islas mayores 3 senadores · islas menores 1 senador<br>
Oficina presupuestaria — depende directamente del Titular de la Subsecretaría del Interior<br>
<b>Referéndum:</b> convocado por el Rey, propuesto por el Presidente del Gobierno, autorizado por las Cortes Generales<br><br>
Regla práctica: si el enunciado dice "sanciones", es sanción`},

{id:'46b',nota:46,cat:'E',titulo:'Apatridia y renovación de residencia temporal no lucrativa',body:`
Solicitud de apatridia: 1 mes desde la entrada<br>
Renovación de residencia temporal no lucrativa: 2 años, salvo RDL`},

{id:'46c',nota:46,cat:'G',titulo:'Coordinación internacional: CCP/CCPA y UIP',body:`
Coordinación CCP y CCPA — DGCYE<br>
Portugal: 5 (CCPA) · Francia: 4 (CCPA)<br>
UIP — Seguridad Ciudadana`},

{id:'47',nota:47,cat:'A',titulo:'Jerarquía normativa española',body:`
<b>Ley Orgánica:</b> derechos fundamentales y libertades públicas — mayoría absoluta del Congreso<br>
<span class="ind1">Si afecta a las CCAA → también mayoría absoluta del Senado</span>
<span class="ind1">Dentro de la LO: Ley de Transferencia (el Estado da facultades a las CCAA)</span>
<b>Ley Ordinaria:</b> Leyes marco, Leyes de armonización<br>
<b>Decreto-Ley:</b> extraordinaria y urgente necesidad<br>
<b>Decreto Legislativo:</b> las Cortes Generales delegan en el Gobierno<br>
<span class="ind1">Ley de Bases → Texto Articulado</span>
<span class="ind1">Ley Ordinaria → Texto Refundido</span>`},

{id:'48a',nota:48,cat:'G',titulo:'Gabinetes MIR/SES y periodicidad de auditorías',body:`
Gabinete MIR — Director General<br>
Gabinete SES — Subdirector General<br><br>
Auditorías PN → cada 5 años<br>
"Revisiones de evaluación inicial" (PN) → cada 4 años · general → cada 4 años`},

{id:'48b',nota:48,cat:'J',titulo:'Rumores y aculturación',body:`
Teoría de los rumores — Allport y Postman<br><br>
<b>Asimilación</b> — el inmigrante pierde su identidad al incorporarse a la sociedad<br>
<b>Aculturación</b> — igual que la asimilación, pero NO se pierde la identidad; se integran elementos<br>
<b>Transculturación</b> — la cultura superior absorbe a la inferior`},

{id:'49',nota:49,cat:'G',titulo:'SGT y el Defensor del Pueblo',body:`La SGT coordina las relaciones del Ministerio del Interior con el Defensor del Pueblo.`},

{id:'50a',nota:50,cat:'A',titulo:'Plazos del BOE y estados de alarma/excepción/sitio',body:`
Publicación en el BOE de una ley, sin fecha: <b>20 días</b><br>
Sanción de la ley para su publicación en el BOE por el Rey: <b>15 días</b><br>
Periodo de pago voluntario: <b>20 días</b><br><br>
<b>Alarma:</b> declara el Gobierno mediante Decreto del Consejo de Ministros <i>[mnemotecnia: GC]</i><br>
<b>Excepción:</b> declara el Gobierno mediante RD del Consejo de Ministros, con autorización del Congreso <i>[mnemotecnia: GC]</i><br>
<b>Sitio:</b> declara el Congreso a propuesta exclusiva del Gobierno <i>[mnemotecnia: CG]</i>`},

{id:'50b',nota:50,cat:'B',titulo:'Procedimientos penales y delitos leves',body:`
<b>Procedimiento ordinario:</b> +9 años — Instrucción: Sumario<br>
<b>Procedimiento abreviado:</b> hasta 9 años — Instrucción: Diligencias previas<br>
<b>Procedimiento de enjuiciamiento rápido:</b> hasta 5 años — Instrucción: Diligencias urgentes<br>
<b>Delitos leves:</b> instruye y enjuicia`},

{id:'51',nota:51,cat:'B',titulo:'Salas de los tribunales: mnemotecnias',body:`

// ---- render ----
const board = document.getElementById('board');
const chipsEl = document.getElementById('chips');
const searchEl = document.getElementById('search');
let activeCats = new Set(Object.keys(CATS)); // todas activas por defecto

function allTags(p){ return [p.cat, ...(p.tags||[])]; }

function snippet(html){
  const div = document.createElement('div');
  div.innerHTML = html.replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'');
  return div.textContent.replace(/\s+/g,' ').trim();
}

function buildChips(){
  const allChip = document.createElement('div');
  allChip.className = 'chip chip-all active';
  allChip.textContent = 'Todas';
  allChip.onclick = () => { activeCats = new Set(Object.keys(CATS)); syncChips(); render(); };
  chipsEl.appendChild(allChip);

  Object.entries(CATS).forEach(([key, cfg]) => {
    const chip = document.createElement('div');
    chip.className = 'chip active';
    chip.style.setProperty('--c', cfg.c);
    chip.style.setProperty('--ct', cfg.ct);
    chip.dataset.cat = key;
    const count = P.filter(p => allTags(p).includes(key)).length;
    chip.innerHTML = `<span class="dot" style="background:${cfg.c}"></span>${cfg.label} <span style="opacity:.6">(${count})</span>`;
    chip.onclick = () => {
      if(activeCats.has(key) && activeCats.size === 1){
        activeCats = new Set(Object.keys(CATS));
      } else if(activeCats.size === Object.keys(CATS).length){
        activeCats = new Set([key]);
      } else if(activeCats.has(key)){
        activeCats.delete(key);
      } else {
        activeCats.add(key);
      }
      syncChips(); render();
    };
    chipsEl.appendChild(chip);
  });
}
function syncChips(){
  document.querySelectorAll('.chip').forEach(c=>{
    if(c.classList.contains('chip-all')){
      c.classList.toggle('active', activeCats.size===Object.keys(CATS).length);
    } else {
      c.classList.toggle('active', activeCats.has(c.dataset.cat));
    }
  });
}

function matchesSearch(p, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(String(p.nota).includes(q)) return true;
  if(p.titulo.toLowerCase().includes(q)) return true;
  if(snippet(p.body).toLowerCase().includes(q)) return true;
  return false;
}

function render(){
  const q = searchEl.value.trim();
  board.innerHTML = '';
  let shown = 0;
  P.forEach((p, i) => {
    const tagsMatch = allTags(p).some(t => activeCats.has(t));
    if(!tagsMatch || !matchesSearch(p, q)) return;
    shown++;
    const cfg = CATS[p.cat];
    const card = document.createElement('div');
    card.className = 'postit';
    card.style.setProperty('--c', cfg.c);
    card.style.setProperty('--ct', cfg.ct);
    const rot = ((i*37)%9 - 4);
    card.style.setProperty('--rot', rot+'deg');
    card.innerHTML = `
      <div class="pin"></div>
      <div class="pit-head"><span>Nota ${p.nota}</span></div>
      <div class="pit-title">${p.titulo}</div>
      <div class="pit-snippet">${snippet(p.body)}</div>
      <div class="pit-cat">${cfg.label}${p.tags?' · '+p.tags.map(t=>CATS[t].label).join(' · '):''}</div>
    `;
    card.onclick = () => openModal(p);
    board.appendChild(card);
  });
  if(shown===0){
    board.innerHTML = '<div class="empty-msg">Ningún post-it coincide con la búsqueda o el filtro seleccionado.</div>';
  }
  document.getElementById('statVisible').textContent = shown;
}

document.getElementById('statTotal').textContent = P.length;

const overlay = document.getElementById('overlay');
const modalCard = document.getElementById('modalCard');
function openModal(p){
  const cfg = CATS[p.cat];
  modalCard.style.setProperty('--c', cfg.c);
  modalCard.style.setProperty('--ct', cfg.ct);
  document.getElementById('modalHead').innerHTML =
    `<span class="tagpill">Nota original ${p.nota}</span><span class="tagpill">${cfg.label}</span>` +
    (p.tags? p.tags.map(t=>`<span class="tagpill">${CATS[t].label}</span>`).join('') : '');
  document.getElementById('modalTitle').textContent = p.titulo;
  let body = p.body;
  if(p.original){
    body += `<div class="orig-note">📌 Nota sobre el original: ${p.original}</div>`;
  }
  document.getElementById('modalBody').innerHTML = body;
  overlay.classList.add('open');
}
document.getElementById('modalClose').onclick = () => overlay.classList.remove('open');
overlay.onclick = (e) => { if(e.target===overlay) overlay.classList.remove('open'); };
document.addEventListener('keydown', e => { if(e.key==='Escape') overlay.classList.remove('open'); });

searchEl.addEventListener('input', render);

buildChips();
render();
</script>
